import '/src/tp-loader.ts';

const cases=[{"name": "paragraphs", "source": "<p>A short paragraph about a <strong>workshop</strong>.</p>\n<p>A second paragraph.</p>\n<p>Room 12<br>Workshop desk</p>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/paragraphs.html"}, {"name": "text-formatting", "source": "<p><strong>Important</strong>, <em>emphasized</em>, <code>inline code</code> and <mark>highlighted</mark>.</p>\n<p>Water: H<sub>2</sub>O. Area: m<sup>2</sup>.</p>\n<p><del>Old text</del> <ins>New text</ins>.</p>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/text-formatting.html"}, {"name": "links", "source": "<p><a href=\"https://asciidoc.org\">AsciiDoc</a> and <a href=\"#practice\">Practice</a>.</p>\n<h2 id=\"practice\">Practice</h2>\n<p>Edit this example.</p>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/links.html"}, {"name": "document-header", "source": "= Workshop guide\nAlex Example\n:showtitle:\n\nA practical introduction to markup.\n", "language": "asciidoc", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/document-header.adoc"}, {"name": "section-titles", "source": "<h1>Workshop</h1>\n<p>A practical introduction.</p>\n<h2>Preparation</h2>\n<p>Read the guide.</p>\n<h3>Materials</h3>\n<p>Bring a notebook.</p>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/section-titles.html"}, {"name": "toc", "source": ":toc:\n:toc-title: Contents\n\n== Preparation\n\nRead the guide.\n\n== Practice\n\nEdit the examples.\n\n=== Review\n\nCompare the results.\n", "language": "asciidoc", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/toc.adoc"}, {"name": "includes", "source": "include::included-fragment.adoc[]\n", "language": "asciidoc", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/includes.adoc"}, {"name": "nested-lists", "source": "<ul>\n  <li>Read</li>\n  <li>Practice\n    <ul>\n      <li>Edit the source</li>\n      <li>Compare the result</li>\n    </ul>\n  </li>\n</ul>\n<ol start=\"3\">\n  <li>Prepare</li>\n  <li>Review</li>\n</ol>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/nested-lists.html"}, {"name": "checklist", "source": "- [x] Read the guide\n- [ ] Edit the source\n- [ ] Compare the results\n", "language": "markdown", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/checklist.md"}, {"name": "description-lists", "source": "<dl>\n  <dt>HTML</dt>\n  <dd>Document structure.</dd>\n  <dt>CSS</dt>\n  <dd>Document presentation.</dd>\n</dl>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/description-lists.html"}, {"name": "images", "source": "<p>An inline <img src=\"shapes.svg\" alt=\"Shapes\" width=\"24\" height=\"24\"> in a sentence.</p>\n<figure>\n  <img src=\"shapes.svg\" alt=\"A circle and a triangle\" width=\"160\">\n  <figcaption>Geometric shapes</figcaption>\n</figure>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/images.html"}, {"name": "audio", "source": "<audio controls src=\"sound.mp3\"></audio>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/audio.html"}, {"name": "video", "source": "<video controls width=\"280\">\n  <source src=\"waterfall.mp4\" type=\"video/mp4\">\n</video>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/video.html"}, {"name": "keyboard", "source": ":experimental:\n\nPress kbd:[Ctrl+S], click btn:[Save], or choose menu:File[Save].\n", "language": "asciidoc", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/keyboard.adoc"}, {"name": "literal", "source": "<pre>First line\n  Indented line\n*Literal stars*</pre>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/literal.html"}, {"name": "source-code", "source": "<pre><code class=\"language-javascript\">const message = \"Hello\";\nconsole.log(message);</code></pre>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/source-code.html"}, {"name": "admonitions", "source": "NOTE: Save a copy before experimenting.\n\nTIP: Change one option at a time.\n\n[WARNING]\n====\nThis example is **editable**.\n====\n", "language": "asciidoc", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/admonitions.adoc"}, {"name": "quotation", "source": "<blockquote>\n  <p>Read the source, then <strong>try a change</strong>.</p>\n  <footer>Alex, <cite>Workshop notes</cite></footer>\n</blockquote>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/quotation.html"}, {"name": "blocks", "source": "<figure>\n  <figcaption>A worked example</figcaption>\n  <p>Read the source and <strong>try a change</strong>.</p>\n</figure>\n<aside>\n  <h3>Optional reading</h3>\n  <p>A short supporting explanation.</p>\n</aside>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/blocks.html"}, {"name": "table-caption-and-alignment", "source": "<table>\n  <caption>Workshop supplies</caption>\n  <thead>\n    <tr><th>Item</th><th style=\"text-align:right\">Quantity</th><th style=\"text-align:center\">Status</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>Notebook</td><td style=\"text-align:right\">2</td><td style=\"text-align:center\">Ready</td></tr>\n    <tr><td>Pencil</td><td style=\"text-align:right\">12</td><td style=\"text-align:center\">Ready</td></tr>\n  </tbody>\n</table>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/table-caption-and-alignment.html"}, {"name": "merged-cells", "source": "<table>\n  <thead>\n    <tr><th colspan=\"2\">Workshop</th></tr>\n  </thead>\n  <tbody>\n    <tr><th rowspan=\"2\">Morning</th><td>Introduction</td></tr>\n    <tr><td>Practice</td></tr>\n  </tbody>\n</table>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/merged-cells.html"}, {"name": "rich-table-cells", "source": "<table>\n  <thead>\n    <tr><th>Session</th><th>Tasks</th></tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>Practice</strong></td>\n      <td>\n        <ul>\n          <li>Edit the source</li>\n          <li>Compare the result</li>\n        </ul>\n        <img src=\"shapes.svg\" alt=\"Shapes\" width=\"80\">\n      </td>\n    </tr>\n  </tbody>\n</table>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/rich-table-cells.html"}, {"name": "ids-roles", "source": "<p id=\"workshop\" class=\"introduction\">This paragraph has an ID and a class.</p>\n<p>See <a href=\"#workshop\">the introduction</a>.</p>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/ids-roles.html"}, {"name": "comments", "source": "<!-- A source-only comment. -->\n<p>Visible paragraph.</p>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/comments.html"}, {"name": "breaks", "source": "<p>Preparation is complete.</p>\n<hr>\n<p>Practice begins.</p>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/breaks.html"}, {"name": "attributes", "source": ":workshop: Markup lab\n:places: 12\n\nWelcome to *{workshop}*. There are {places} places.\n", "language": "asciidoc", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/attributes.adoc"}, {"name": "replacements", "source": "Copyright (C), registered (R), trademark (TM).\n\nWait... then continue -> the next topic.\n", "language": "asciidoc", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/replacements.adoc"}, {"name": "escaping", "source": "<p>Write &lt;p&gt; for a paragraph and &amp; for an ampersand.</p>\n<p>Literal *stars* and {braces}.</p>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/escaping.html"}, {"name": "bibliography", "source": "See <<guide>> for the workshop method.\n\n[bibliography]\n== References\n\n* [[[guide]]] Alex. _Workshop guide_. 2026.\n", "language": "asciidoc", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/bibliography.adoc"}, {"name": "footnotes", "source": "A short workshop footnote:duration[Breaks are included.].\n\nThe same note again footnote:duration[].\n", "language": "asciidoc", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/footnotes.adoc"}, {"name": "markdown-compatibility", "source": "- First item\n- Second item\n\n```javascript\nconsole.log(\"Hello\");\n```\n", "language": "asciidoc", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/markdown-compatibility.adoc"}, {"name": "mathematics", "source": "Inline mathematics: $E=mc^2$.\n\nDisplay mathematics:\n\\[\n\\frac{a}{b}+\\sqrt{x}\n\\]\n", "language": "latex", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/mathematics.tex"}, {"name": "custom-elements", "source": "<tp-box>\n  <tp-callout variant=\"info\" heading=\"Inside the box\">\n    <p>Ordinary <strong>HTML</strong> inside a component.</p>\n    <tp-box>A third nested component.</tp-box>\n  </tp-callout>\n</tp-box>\n", "language": "html", "base": "http://127.0.0.1:4326/docs/markup-cheatsheet-examples/custom-elements.html"}];
const signature=html=>{const t=document.createElement('template');t.innerHTML=html;
for(const e of t.content.querySelectorAll('[data-tp-list-marker]')) e.remove();
for(const e of t.content.querySelectorAll('tp-math')) {const v=e.getAttribute('value')||e.querySelector('script')?.textContent||e.textContent;e.replaceChildren(document.createTextNode(v.trim()));}
for(const e of t.content.querySelectorAll('script,style')) e.remove();
for(const e of t.content.querySelectorAll('p,div,h1,h2,h3,h4,h5,h6,li,dt,dd,td,th,caption,figcaption,blockquote,footer,header,br,tp-box,tp-callout')) {e.before(document.createTextNode(' '));e.after(document.createTextNode(' '));}
return {text:t.content.textContent.replace(/\u200b/g, "").replace(/\s+/g,' ').trim(),headings:[...t.content.querySelectorAll('h1,h2,h3,h4,h5,h6')].map(e=>e.tagName),tables:t.content.querySelectorAll('table').length,images:t.content.querySelectorAll('img').length,media:t.content.querySelectorAll('audio,video').length,code:t.content.querySelectorAll('pre').length,
inlineCode:[...t.content.querySelectorAll('code:not(pre code)')].map(e=>e.textContent),
formatting:['strong,b','em,i','sub','sup','mark,.mark','s,del,.line-through','ins','kbd'].map(sel=>[...t.content.querySelectorAll(sel)].map(e=>e.textContent.trim()).sort()),
math:[...t.content.querySelectorAll('tp-math')].map(e=>({value:e.textContent.trim().replace(/\s+/g,' '),display:e.hasAttribute('displaystyle')})),
cells:[...t.content.querySelectorAll('td,th')].map(e=>({tag:e.localName,text:e.textContent.trim().replace(/\s+/g,' '),span:[e.colSpan,e.rowSpan],align:e.style.textAlign|| (e.classList.contains('halign-right')?'right':e.classList.contains('halign-center')?'center':'left')})),
breaks:t.content.querySelectorAll('br').length+[...t.content.querySelectorAll('.line-block')].reduce((n,e)=>n+Math.max(0,e.children.length-1),0),
checkboxes:[...t.content.querySelectorAll('input[type="checkbox"]')].map(e=>e.checked)};};
document.querySelector('#run').onclick=async()=>{const results=[];
for(const c of cases){
 try {const response=await fetch(c.base); if(!response.ok) throw new Error(`Unable to load ${c.base}: ${response.status}`); c.source=await response.text(); const original=await markupToHtml(c.source,c.language,c.base), expected=signature(original);
 for(const language of ['html','asciidoc','latex','markdown','restructuredtext']) {
 document.querySelector('#status').textContent=c.name+' → '+language;
 let code; try {code=language===c.language?c.source:htmlToMarkup(original,language); const html=await markupToHtml(code,language,c.base),actual=signature(html);
 results.push({name:c.name,language,code,original,html,expected,actual,pass:JSON.stringify(actual)===JSON.stringify(expected)});
 }catch(e){results.push({name:c.name,language,code,error:String(e),pass:false});}
 }
 }catch(e){results.push({name:c.name,error:String(e),pass:false});}
}
document.querySelector('#report').textContent=JSON.stringify(results);
document.querySelector('#summary').textContent=JSON.stringify(results.filter(r=>!r.pass).map(({name,language,error,expected,actual})=>({name,language,error,expected,actual})),null,2);
document.querySelector('#status').textContent='Complete: '+results.filter(r=>r.pass).length+'/'+results.length;
};</script>
