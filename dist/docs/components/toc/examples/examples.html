<tp-html-viewer label="tp-toc" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-box data-tp-toc-scope="">
        <tp-toc label="On this page" open="" expand-all=""></tp-toc>
        <h2>Getting started</h2>
        <p>Choose a heading in the table of contents to jump to its section.</p>
        <h3>Installation</h3><p>Install the library in your project.</p>
        <h3>First component</h3><p>Add your first interactive component.</p>
      </tp-box>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>
      <tp-checkbox-list id="attributes-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value=""><ul><li>brand</li><li>expand-all</li><li>open</li></ul></tp-checkbox-list>
      <tp-radio-list data-setting="position" label="position" label-position="top" orientation="horizontal" value="3"><ul><li>start</li><li>end</li><li>center</li></ul></tp-radio-list>
      <tp-cluster><tp-textfield data-setting="label" label="label" value="Contents" placeholder="Contents" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="toc attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/docs/components/toc/examples/attributes.js"></script>
    </div>
  </template>
</tp-html-viewer>
