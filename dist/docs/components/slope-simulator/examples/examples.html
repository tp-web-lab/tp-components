<tp-html-viewer label="tp-slope-simulator" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-slope-simulator></tp-slope-simulator>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>



      <tp-stack>

      <tp-radio-list data-setting="src" label="src" label-position="top" orientation="horizontal" value="1"><ul><li>Default</li><li>Two passes</li><li>Limit slopes</li><li>file-unknown</li></ul></tp-radio-list>
      <tp-cluster><tp-textfield data-setting="speed-base" label="speed-base" value="30" placeholder="30" clearable=""></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="slope-simulator attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>
      <p>File-loading attributes offer only Default, file1, file2 and file-unknown. The two local fixtures preserve verified example formats (they may contain the same content); file-unknown deliberately exercises error handling. No arbitrary path can be entered.</p>
      <script type="module" src="/docs/components/slope-simulator/examples/attributes.js"></script>
    </div>

    <div role="example" label="Tour of Lombardy 2026">
      <p>Approximate reconstruction of the supplied Tour of Lombardy 2026 profile image (239.6 km). Distances and elevations are estimated for this interactive example, not official route or GPS data. Every segment stays within ±20%; vertical exaggeration affects only the drawing.</p>
      <tp-slope-simulator src="/docs/components/slope-simulator/examples/2026-lombardy-tour.json"></tp-slope-simulator>
    </div>

    <div role="example" label="Alpe d’Huez 2026">
      <p>Approximate reconstruction of the supplied Alpe d’Huez 2026 stage profile image (170.9 km), from Le Bourg d’Oisans via the Croix de Fer, Télégraphe, Galibier and Sarenne passes. Labelled distances and elevations are taken from the image; intermediate points are estimated for this interactive example, not official GPS data. Every segment stays within ±20%; vertical exaggeration affects only the drawing.</p>
      <tp-slope-simulator src="/docs/components/slope-simulator/examples/2026-alpe-huez.json"></tp-slope-simulator>
    </div>
  </template>
</tp-html-viewer>
