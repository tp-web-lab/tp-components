<tp-html-viewer label="tp-flip-card" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-flip-card>
      <dl>
        <dt>recto</dt><dd><p>This is the content <strong>recto...</strong></p></dd>
        <dt>verso</dt><dd><p>...and here is the content <strong>verso.</strong></p></dd>
      </dl>
      </tp-flip-card>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>
      <tp-checkbox-list id="attributes-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value=""><ul><li>disabled</li><li>fit-content</li><li>flipped</li></ul></tp-checkbox-list>
      <tp-radio-list data-setting="button-position" label="button-position" label-position="top" orientation="horizontal" value="6"><ul><li>top start</li><li>top center</li><li>top end</li><li>bottom start</li><li>bottom center</li><li>bottom end</li><li>none</li></ul></tp-radio-list>
      <tp-cluster></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="flip-card attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/docs/components/flip-card/examples/attributes.js"></script>
    </div>
