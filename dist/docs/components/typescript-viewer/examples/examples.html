<tp-html-viewer label="tp-typescript-viewer" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-typescript-viewer src="/docs/components/_shared/intro-projects/typescript.json"></tp-typescript-viewer>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/typescript-viewer/typescript-viewer.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-typescript-viewer");
      element1.setAttribute("src", "/docs/components/_shared/intro-projects/typescript.json");
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="src">
      <tp-typescript-viewer src="/docs/components/typescript-viewer/examples/example.json"></tp-typescript-viewer>
    </div>

    <div role="example" label="script">
      <tp-typescript-viewer>
            <script type="tp/typescript">
              const message: string = 'Hello TypeScript viewer';

              document.querySelector('#app')!.textContent = message;
              console.log(message);
            </script>
          </tp-typescript-viewer>
    </div>

    <div role="example" label="error">
      <tp-typescript-viewer>
            <script type="tp/typescript">
              console.error(new Error('Intentional TypeScript error'));
            </script>
          </tp-typescript-viewer>
    </div>

    <div role="example" label="Single source file">
      <tp-typescript-viewer src="/docs/components/_shared/single-source/example.ts"></tp-typescript-viewer>
    </div>
  </template>
</tp-html-viewer>
