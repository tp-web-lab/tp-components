<tp-html-viewer label="tp-restructuredtext" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-restructuredtext>
        <script type="tp/restructuredtext">
          Hello, **Docutils**!
        </script>
      </tp-restructuredtext>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/restructuredtext/restructuredtext.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-restructuredtext");
      element1.append(document.createTextNode("\n  "));

      const element2 = document.createElement("script");
      element2.setAttribute("type", "tp/restructuredtext");
      element2.textContent = "\n    Hello, **Docutils**!\n  ";
      element1.append(element2);
      element1.append(document.createTextNode("\n"));
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="External document">
      <tp-restructuredtext src="/docs/components/restructuredtext/examples/basic-usage.rst"></tp-restructuredtext>
    </div>
  </template>
</tp-html-viewer>
