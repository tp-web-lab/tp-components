<tp-html-viewer label="tp-speech-to-text" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-speech-to-text lang="en-US" interim-results=""></tp-speech-to-text>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/speech-to-text/speech-to-text.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-speech-to-text");
      element1.setAttribute("lang", "en-US");
      element1.setAttribute("interim-results", "");
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="French">
      <tp-speech-to-text lang="fr-FR"></tp-speech-to-text>
    </div>

    <div role="example" label="Recording">
      <tp-speech-to-text lang="en-GB" continuous="" interim-results="" record=""></tp-speech-to-text>
    </div>
  </template>
</tp-html-viewer>
