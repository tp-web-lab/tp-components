<tp-html-viewer label="tp-sidebar" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-sidebar side-width="12rem" gap="1rem">
        <tp-box><h3>Navigation</h3><p>Overview</p><p>Examples</p></tp-box>
        <tp-box><h3>Main content</h3><p>The sidebar stays beside this content while there is enough space.</p></tp-box>
      </tp-sidebar>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>
      <tp-checkbox-list id="attributes-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value=""><ul><li>right-sidebar</li></ul></tp-checkbox-list>

      <tp-cluster><tp-textfield data-setting="content-width" label="content-width" value="50%" placeholder="50%" clearable></tp-textfield>
      <tp-textfield data-setting="gap" label="gap" value="1rem" placeholder="1rem" clearable></tp-textfield>
      <tp-textfield data-setting="side-width" label="side-width" value="auto" placeholder="auto" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="sidebar attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/docs/components/sidebar/examples/attributes.js"></script>
    </div>
  </template>
</tp-html-viewer>
