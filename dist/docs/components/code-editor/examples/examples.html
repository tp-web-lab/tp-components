<tp-html-viewer label="tp-code-editor" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-code-editor language="javascript" line-numbers="">
        <script type="tp/javascript">
      const greeting = "Hello, tp-components!";
      console.log(greeting);
        </script>
      </tp-code-editor>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>
      <tp-checkbox-list id="attributes-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value=""><ul><li>fold-gutter</li><li>line-numbers</li><li>readonly</li><li>toolbar</li><li>word-wrap</li></ul></tp-checkbox-list>
      <tp-radio-list data-setting="dir" label="dir" label-position="top" orientation="horizontal" value="1"><ul><li>inherited</li><li>ltr</li><li>rtl</li><li>auto</li></ul></tp-radio-list>
      <tp-radio-list data-setting="src" label="src" label-position="top" orientation="horizontal" value="1"><ul><li>Default</li><li>file1</li><li>file2</li><li>file-unknown</li></ul></tp-radio-list>
      <tp-cluster><tp-textfield data-setting="filename" label="filename" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="lang" label="lang" value="inherited" placeholder="inherited" clearable></tp-textfield>
      <tp-textfield data-setting="language" label="language" value="html" placeholder="html" clearable></tp-textfield>
      <tp-textfield data-setting="placeholder" label="placeholder" value="Type some LANGUAGE code... or F1 to toggle the toolbar" placeholder="Type some LANGUAGE code... or F1 to toggle the toolbar" clearable></tp-textfield>
      <tp-textfield data-setting="value" label="value" value="" placeholder="" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="code-editor attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>
      <p>File-loading attributes offer only Default, file1, file2 and file-unknown. The two local fixtures preserve verified example formats (they may contain the same content); file-unknown deliberately exercises error handling. No arbitrary path can be entered.</p>
      <script type="module" src="/docs/components/code-editor/examples/attributes.js"></script>
    </div>

    <div role="example" label="Using an internal script">
      <tp-code-editor line-numbers="">
            <script type="tp/typescript">
              function f(x: number): string {
                if (x < 0) { x = x + 1 }
                else { x = x - 1 }
                return `${2*x}`;
              }
            </script>
          </tp-code-editor>
          <script type="module">
            import '/components/code-editor/code-editor.js';
          </script>
    </div>
  </template>
</tp-html-viewer>
