<tp-html-viewer label="tp-python-viewer" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-python-viewer src="/docs/components/_shared/intro-projects/python.json"></tp-python-viewer>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/python-viewer/python-viewer.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-python-viewer");
      element1.setAttribute("src", "/docs/components/_shared/intro-projects/python.json");
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="src">
      <tp-python-viewer src="/docs/components/python-viewer/examples/example.json"></tp-python-viewer>
    </div>

    <div role="example" label="script">
      <tp-python-viewer>
            <script type="tp/python">
              message = "Hello Python viewer"
              print(message)
            </script>
          </tp-python-viewer>
    </div>

    <div role="example" label="matplotlib">
      <tp-python-viewer src="/docs/components/python-viewer/examples/matplotlib.json"></tp-python-viewer>
    </div>

    <div role="example" label="error">
      <tp-python-viewer>
            <script type="tp/python">
              raise RuntimeError("Intentional Python error")
            </script>
          </tp-python-viewer>
    </div>

    <div role="example" label="Single source file">
      <tp-python-viewer src="/docs/components/_shared/single-source/example.py"></tp-python-viewer>
    </div>
  </template>
</tp-html-viewer>
