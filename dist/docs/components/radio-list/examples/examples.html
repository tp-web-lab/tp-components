<tp-html-viewer label="tp-radio-list" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-radio-list name="theme" value="2" orientation="horizontal">
          <ul><li>Light</li><li>Automatic</li><li>Dark</li></ul>
        </tp-radio-list>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>

      <tp-radio-list data-setting="label-position" label="label-position" label-position="top" orientation="horizontal" value="1"><ul><li>top</li><li>bottom</li><li>start</li><li>end</li></ul></tp-radio-list>
      <tp-radio-list data-setting="orientation" label="orientation" label-position="top" orientation="horizontal" value="2"><ul><li>horizontal</li><li>vertical</li></ul></tp-radio-list>
      <tp-cluster><tp-textfield data-setting="label" label="label" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="name" label="name" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="value" label="value" value="" placeholder="" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="radio-list attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/docs/components/radio-list/examples/attributes.js"></script>
    </div>
  </template>
</tp-html-viewer>
