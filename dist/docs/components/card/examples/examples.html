<tp-html-viewer label="tp-card" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-card>
              <dl>
                <dt>header</dt><dd>content header</dd>
                <dt>footer</dt><dd>content footer</dd>
                <dt>main</dt><dd>content body</dd>
              </dl>
            </tp-card>
    </div>

    <div role="example" label="Image card">
      <tp-card>
              <dl>
                <dt>main</dt>
                <dd><img src="https://images.unsplash.com/photo-1559209172-0ff8f6d49ff7?ixlib=rb-1.2.1&amp;ixid=eyJhcHBfaWQiOjEyMDd9&amp;auto=format&amp;fit=crop&amp;w=500&amp;q=80" alt="Seashore"></dd>
              </dl>
            </tp-card>
    </div>

    <div role="example" label="Icon card">
      <tp-card>
              <dl>
                <dt>main</dt><dd><tp-icon name="logo-tp-components" size="5em"></tp-icon></dd>
              </dl>
            </tp-card>
    </div>
  </template>
</tp-html-viewer>
