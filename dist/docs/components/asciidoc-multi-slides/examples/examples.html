<tp-html-viewer label="tp-asciidoc-multi-slides" allow-script style="--tp-html-viewer-frame-min-height: 32rem">
  <template>
    <div role="example" label="Basic usage">
      <tp-asciidoc-multi-slides repository="/docs/components/asciidoc-multi-pages/docs"></tp-asciidoc-multi-slides>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/asciidoc/asciidoc.js";
      import "/components/asciidoc-multi-slides/asciidoc-multi-slides.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-asciidoc-multi-slides");
      element1.setAttribute("repository", "/docs/components/asciidoc-multi-pages/docs");
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="Automatic notes">
      <tp-asciidoc-multi-slides repository="/docs/components/markup-multi-slides/automatic/adoc" auto="notes" timing="5000" label="Automatic notes"></tp-asciidoc-multi-slides>
    </div>

    <div role="example" label="Timed steps">
      <tp-asciidoc-multi-slides repository="/docs/components/markup-multi-slides/automatic/adoc" auto="timing" timing="5000" label="Timed steps"></tp-asciidoc-multi-slides>
    </div>
  </template>
</tp-html-viewer>
