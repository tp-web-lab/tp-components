<tp-html-viewer label="tp-center" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-center intrinsic="">
            <tp-box>Centered content</tp-box>
          </tp-center>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>
      <tp-checkbox-list id="attributes-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value=""><ul><li>center-text</li><li>intrinsic</li></ul></tp-checkbox-list>

      <tp-cluster><tp-textfield data-setting="max-inline-size" label="max-inline-size" value="60ch" placeholder="60ch" clearable></tp-textfield>
      <tp-textfield data-setting="padding-inline" label="padding-inline" value="0px" placeholder="0px" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="center attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/docs/components/center/examples/attributes.js"></script>
    </div>

    <div role="example" label="Constrained region">
      <p>Compare the two centered regions: the narrow region wraps the same text onto more lines. Resize the preview to see both regions shrink when less space is available.</p>
      <tp-stack>
      <tp-box><p><strong>Maximum width: 18rem</strong></p><tp-center max-inline-size="18rem"><tp-box invert="">The same text appears in both regions. The maximum width controls the width of the region, not the alignment of its text. Equal space on either side keeps the region centered.</tp-box></tp-center></tp-box>
      <tp-box><p><strong>Maximum width: 36rem</strong></p><tp-center max-inline-size="36rem"><tp-box invert="">The same text appears in both regions. The maximum width controls the width of the region, not the alignment of its text. Equal space on either side keeps the region centered.</tp-box></tp-center></tp-box>
      </tp-stack>
    </div>
  </template>
</tp-html-viewer>
