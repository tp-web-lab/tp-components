<tp-html-viewer label="tp-center" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-center intrinsic="">
            <tp-box>Centered content</tp-box>
          </tp-center>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/box/box.js";
      import "/components/center/center.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-center");
      element1.setAttribute("intrinsic", "");
      element1.append(document.createTextNode("\n      "));

      const element2 = document.createElement("tp-box");
      element2.append(document.createTextNode("Centered content"));
      element1.append(element2);
      element1.append(document.createTextNode("\n    "));
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="Constrained region">
      <p>Compare the two centered regions: the narrow region wraps the same text onto more lines. Resize the preview to see both regions shrink when less space is available.</p>
      <tp-stack>
      <tp-box><p><strong>Maximum width: 18rem</strong></p><tp-center max-inline-size="18rem"><tp-box invert="">The same text appears in both regions. The maximum width controls the width of the region, not the alignment of its text. Equal space on either side keeps the region centered.</tp-box></tp-center></tp-box>
      <tp-box><p><strong>Maximum width: 36rem</strong></p><tp-center max-inline-size="36rem"><tp-box invert="">The same text appears in both regions. The maximum width controls the width of the region, not the alignment of its text. Equal space on either side keeps the region centered.</tp-box></tp-center></tp-box>
      </tp-stack>
    </div>
  </template>
</tp-html-viewer>
