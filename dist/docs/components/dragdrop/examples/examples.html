            <h3>To do</h3>
            <tp-stack gap="0.5rem" data-tasks="">
              <tp-box data-task="" aria-label="Write the introduction"><p>Write the introduction</p><tp-button data-move="" size="s" aria-label="Move Write the introduction to the other column">Move</tp-button></tp-box>
              <tp-box data-task="" aria-label="Review the examples"><p>Review the examples</p><tp-button data-move="" size="s" aria-label="Move Review the examples to the other column">Move</tp-button></tp-box>
            </tp-stack>

              <tp-box data-task="" aria-label="Choose a title"><p>Choose a title</p><tp-button data-move="" size="s" aria-label="Move Choose a title to the other column">Move</tp-button></tp-box>
            </tp-stack>
          </tp-box>
        </tp-grid>
        <p data-demo-status="" role="status" aria-live="polite">Move a task to change its column.</p>
        <tp-dragdrop root="#dragdrop-board" items="[data-task]"></tp-dragdrop>
        <script src="/docs/components/dragdrop/examples/task-board.js"></script>

    <div role="example" label="Sortable list">
      <tp-box id="dragdrop-sortable" data-sortable-demo="" data-allow-script="">
        <p>Arrange these steps in the order you prefer. Drag an entry above or below another entry, or use its Up and Down buttons.</p>
        <p>Keyboard: Tab to an entry, press Enter or Space to grab it, use the arrow keys to choose a position, then press Enter or Space to drop. Escape cancels.</p>
        <ol aria-label="Publishing steps">
          <li aria-label="Publish the document"><tp-box><tp-cluster justify="space-between"><span>Publish the document</span><tp-button-group><tp-icon-button name="arrow-up" data-direction="up" label="Move Publish the document up"></tp-icon-button><tp-icon-button name="arrow-down" data-direction="down" label="Move Publish the document down"></tp-icon-button></tp-button-group></tp-cluster></tp-box></li>
          <li aria-label="Write a draft"><tp-box><tp-cluster justify="space-between"><span>Write a draft</span><tp-button-group><tp-icon-button name="arrow-up" data-direction="up" label="Move Write a draft up"></tp-icon-button><tp-icon-button name="arrow-down" data-direction="down" label="Move Write a draft down"></tp-icon-button></tp-button-group></tp-cluster></tp-box></li>
          <li aria-label="Review the content"><tp-box><tp-cluster justify="space-between"><span>Review the content</span><tp-button-group><tp-icon-button name="arrow-up" data-direction="up" label="Move Review the content up"></tp-icon-button><tp-icon-button name="arrow-down" data-direction="down" label="Move Review the content down"></tp-icon-button></tp-button-group></tp-cluster></tp-box></li>
          <li aria-label="Plan the document"><tp-box><tp-cluster justify="space-between"><span>Plan the document</span><tp-button-group><tp-icon-button name="arrow-up" data-direction="up" label="Move Plan the document up"></tp-icon-button><tp-icon-button name="arrow-down" data-direction="down" label="Move Plan the document down"></tp-icon-button></tp-button-group></tp-cluster></tp-box></li>
        </ol>

    <div role="example" label="Tree drag and drop">
      <tp-box>
        <p>Organize this project by dragging files or folders. Try moving <strong>notes.md</strong> into <strong>Documentation</strong>, then move <strong>index.html</strong> above <strong>app.js</strong>.</p>
        <p>Drop in the middle of a folder row to move an item into it, or near the top or bottom of a row to insert it before or after that item. The tree highlights the destination. Moving a folder also moves its children.</p>
        <p>Use the disclosure buttons to expand or collapse folders. Keyboard arrow keys navigate the tree; they do not perform drag and drop in this example.</p>
        <tp-tree draggable="" selectable="" guides="" level="3" aria-label="Project files">
          <ul>

              <ul>

                    <li data-node-id="guide">guide.md</li>
                  </ul>
                </li>
                <li data-node-id="source">Source
                  <ul>
                    <li data-node-id="app">app.js</li>
                    <li data-node-id="index">index.html</li>
                  </ul>
                </li>
                <li data-node-id="notes">notes.md</li>
