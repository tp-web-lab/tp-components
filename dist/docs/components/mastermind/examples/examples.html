<tp-html-viewer label="tp-mastermind" allow-script>

    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/mastermind/mastermind.js";

      element1.setAttribute("attempts", "8");
      example.append(element1);

      document.body.append(example);

    </div>

    <div role="example" label="mastermind ⭐⭐">
      <tp-mastermind solution="orange purple red green" attempts="8"></tp-mastermind>
    </div>
