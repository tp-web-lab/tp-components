<tp-html-viewer label="tp-python-playground" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-python-playground src="/docs/components/_shared/intro-projects/python.json"></tp-python-playground>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/python-playground/python-playground.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-python-playground");
      element1.setAttribute("src", "/docs/components/_shared/intro-projects/python.json");
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="Single source file">
      <tp-python-playground src="/docs/components/_shared/single-source/example.py"></tp-python-playground>
    </div>
  </template>
</tp-html-viewer>
