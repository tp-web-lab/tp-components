<tp-html-viewer label="tp-latex-playground" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-latex-playground><script type="tp/latex">\section{Hello}A formula $x^2$.</script></tp-latex-playground>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/latex/latex.js";
      import "/components/latex-playground/latex-playground.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-latex-playground");

      const element2 = document.createElement("script");
      element2.setAttribute("type", "tp/latex");
      element2.textContent = "\\section{Hello}A formula $x^2$.";
      element1.append(element2);
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="A document in sections">
      <tp-latex-playground repository="/examples/playgrounds/latex-playground/09-sectioned-document"></tp-latex-playground>
    </div>

    <div role="example" label="A document with a TikZ figure">
      <tp-latex-playground repository="/examples/playgrounds/latex-playground/10-illustrated-document"></tp-latex-playground>
    </div>
  </template>
</tp-html-viewer>
