<tp-html-viewer label="tp-dropdown" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-box data-intro-action="dropdown" data-allow-script="">
        <tp-button id="intro-dropdown-trigger" data-demo-trigger="">Open the menu</tp-button>
        <tp-dropdown anchor="#intro-dropdown-trigger" outside-click=""><ul><li><a href="/#/components/button/index.md">Buttons</a></li><li><a href="/#/components/tree/index.md">Trees</a></li></ul></tp-dropdown>
        <p data-demo-status="" role="status">Try the dropdown using its trigger.</p>
        <script src="/docs/components/_shared/introduction-actions.js"></script>
      </tp-box>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>
      <tp-checkbox-list id="attributes-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value=""><ul><li>open</li><li>outside-click</li></ul></tp-checkbox-list>
      <tp-radio-list data-setting="placement" label="placement" label-position="top" orientation="horizontal" value="3"><ul><li>top</li><li>end</li><li>bottom</li><li>start</li></ul></tp-radio-list>
      <tp-cluster><tp-textfield data-setting="anchor" label="anchor" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="offset" label="offset" value="8px" placeholder="8px" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="dropdown attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/docs/components/dropdown/examples/attributes.js"></script>
    </div>
  </template>
</tp-html-viewer>
