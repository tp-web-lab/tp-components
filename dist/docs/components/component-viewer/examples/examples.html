<tp-html-viewer label="tp-component-viewer" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-component-viewer tag="tp-button"></tp-component-viewer>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/component-viewer/component-viewer.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-component-viewer");
      element1.setAttribute("tag", "tp-button");
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="Custom content">
      <tp-component-viewer src="/docs/components/component-viewer/examples/button.html"></tp-component-viewer>
    </div>
  </template>
</tp-html-viewer>
