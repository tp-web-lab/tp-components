<tp-html-viewer label="tp-typewriting" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-typewriting speed="20">
        <p>Welcome to <strong>tp-components</strong>. Make your words appear progressively.</p>
      </tp-typewriting>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/typewriting/typewriting.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-typewriting");
      element1.setAttribute("speed", "20");
      element1.append(document.createTextNode("\n  "));

      const element2 = document.createElement("p");
      element2.append(document.createTextNode("Welcome to "));

      const element3 = document.createElement("strong");
      element3.append(document.createTextNode("tp-components"));
      element2.append(element3);
      element2.append(document.createTextNode(". Make your words appear progressively."));
      element1.append(element2);
      element1.append(document.createTextNode("\n"));
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="Synchronized speech">
      <p>Press Speak, then try Pause, Resume and Stop. Some voices do not report word boundaries; the full text remains visible in that case.</p>
      <tp-typewriting id="spoken-text" word="">
        <p>Welcome to <strong>tp-components</strong>. You can pause this reading and resume it whenever you want.</p>
      </tp-typewriting>
      <tp-text-to-speech for="spoken-text" lang="en"></tp-text-to-speech>
    </div>
  </template>
</tp-html-viewer>
