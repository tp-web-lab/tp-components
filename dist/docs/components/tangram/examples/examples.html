<tp-html-viewer label="tp-tangram" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-tangram></tp-tangram>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>


      <tp-stack>
      <tp-checkbox-list id="attributes-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value=""><ul><li>exact-orientation</li></ul></tp-checkbox-list>
      <tp-radio-list data-setting="src" label="src" label-position="top" orientation="horizontal" value="1"><ul><li>Default</li><li>Square (text)</li><li>Diamond (JSON)</li><li>file-unknown</li></ul></tp-radio-list>
      <tp-cluster></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="tangram attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>
      <p>File-loading attributes offer only Default, file1, file2 and file-unknown. The two local fixtures preserve verified example formats (they may contain the same content); file-unknown deliberately exercises error handling. No arbitrary path can be entered.</p>
      <script type="module" src="/docs/components/tangram/examples/attributes.js"></script>
    </div>

    <div role="example" label="Named vertices">
      <tp-tangram>
      <script type="tp/tangram">
      # Corners of a square of side 4
      point A = (0, 0)
      point B = (4, 0)
      point C = (4, 4)
      point D = (0, 4)

      # Shared landmarks
      point O = midpoint(A, C)
      point E = midpoint(B, C)
      point F = midpoint(C, D)
      point G = midpoint(B, O)
      point H = midpoint(O, C)
      point I = midpoint(O, D)

      # The seven pieces, described by their boundary vertices
      triangle A B O
      triangle A O D
      triangle E C F
      triangle B E G
      triangle O H I
      square O G E H
      parallelogram D F H I
      </script>
      </tp-tangram>
    </div>
