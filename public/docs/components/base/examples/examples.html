<tp-html-viewer label="tp-base" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-base>This element provides the common tp-components foundation.</tp-base>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/base/base.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-base");
      element1.append(document.createTextNode("This element provides the common tp-components foundation."));
      example.append(element1);

      document.body.append(example);
      </script>
    </div>
  </template>
</tp-html-viewer>
