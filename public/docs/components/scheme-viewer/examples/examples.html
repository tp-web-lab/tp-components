<tp-html-viewer label="tp-scheme-viewer" allow-script preserve-source>
  <template>
    <div role="example" label="Basic usage">
      <tp-scheme-viewer src="/docs/components/_shared/intro-projects/scheme.json"></tp-scheme-viewer>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/scheme/scheme.js";
      import "/components/scheme-viewer/scheme-viewer.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-scheme-viewer");
      element1.setAttribute("src", "/docs/components/_shared/intro-projects/scheme.json");
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="Scheme tests">
      <tp-scheme-viewer src="/docs/components/scheme-playground/examples/test-project.json"></tp-scheme-viewer>
    </div>

    <div role="example" label="Compare presentation modes">
      <section>
      <h3>mode="default" — Standard controls</h3>
      <p>Open Code to edit the source, then click Run or press <kbd>Shift</kbd>+<kbd>Enter</kbd> in the editor.</p>
      <p>Run to show the printed message and intentional error in the output. This viewer has no separate console; JavaScript console messages also appear in the output.</p>
      <tp-scheme-viewer mode="default">
        <script type="tp/scheme" filename="main.scm">
      (display "Printed message before the intentional error.")
      (newline)
      (error "Intentional error: the error appears in the output.")
        </script>
      </tp-scheme-viewer>
      </section>

      <section>
      <h3>mode="lite" — Compact controls</h3>
      <p>Open Code to edit the source, then click Run or press <kbd>Shift</kbd>+<kbd>Enter</kbd> in the editor.</p>
      <p>Run to show the printed message and intentional error in the output. This viewer has no separate console; JavaScript console messages also appear in the output.</p>
      <tp-scheme-viewer mode="lite">
        <script type="tp/scheme" filename="main.scm">
      (display "Printed message before the intentional error.")
      (newline)
      (error "Intentional error: the error appears in the output.")
        </script>
      </tp-scheme-viewer>
      </section>

      <section>
      <h3>mode="simple" — Editor and rendered output only</h3>
      <p>Edit the code below, keep the cursor in the editor and press <kbd>Shift</kbd>+<kbd>Enter</kbd> (Return) to run it. This viewer has no Run button.</p>
      <p>Run to show the printed message and intentional error in the output. This viewer has no separate console; JavaScript console messages also appear in the output.</p>
      <tp-scheme-viewer mode="simple">
        <script type="tp/scheme" filename="main.scm">
      (display "Printed message before the intentional error.")
      (newline)
      (error "Intentional error: the error appears in the output.")
        </script>
      </tp-scheme-viewer>
      </section>
      <p>Programming viewers already have compact controls, so default and lite look alike. The first run may load the language engine.</p>
    </div>
  </template>
</tp-html-viewer>
