<tp-html-viewer label="tp-question" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-question>
          <dl>
            <dt>Title</dt><dd>Reflection</dd>
            <dt>Prompt</dt><dd>Describe one benefit of web components.</dd>
          <dt>Form</dt><dd><tp-textfield multiline="" rows="3" placeholder="Type your answer..."></tp-textfield></dd>
            <dt>Feedback</dt><dd>Think about encapsulation and reuse.</dd>
            <dt>Solution</dt><dd>They package reusable behavior behind a custom element.</dd>
          </dl>
        </tp-question>
    </div>

    <div role="example" label="Timed question">
      <tp-question timing="00:00:10" open="">
        <dl>
          <dt>Title</dt><dd>A timed reflection</dd>
          <dt>Prompt</dt><dd>Name one reusable web component.</dd>
          <dt>Form</dt><dd><tp-textfield clearable="" placeholder="Your answer"></tp-textfield></dd>
          <dt>Solution</dt><dd>A button, a timer or an audio recorder.</dd>
        </dl>
      </tp-question>
    </div>

    <div role="example" label="Optional score">
      <tp-fill-blank-question score="" open="">
        <dl>
          <dt>Title</dt><dd>An optional numerical score</dd>
          <dt>Answers</dt><dd><ol><li>blue</li></ol></dd>
          <dt>Prompt</dt><dd>Type blue, then submit.</dd>
          <dt>Form</dt><dd><tp-textfield clearable="" label="Color"></tp-textfield></dd>
          <dt>Feedback</dt><dd>Use the word requested in the prompt.</dd>
          <dt>Solution</dt><dd>blue</dd>
        </dl>
      </tp-fill-blank-question>
    </div>
  </template>
</tp-html-viewer>
