    <div role="example" label="Basic usage">
      <tp-asciidoc>
        <script type="tp/asciidoc">
      == A short document

      This paragraph uses *AsciiDoc*.

      * Write content
      * Add components
      * Publish the page
        </script>
      </tp-asciidoc>

    <div role="example" label="Advanced example">
      <tp-asciidoc>
              <script type="tp/asciidoc">
                include::advanced-example.adoc[]
              </script>
            </tp-asciidoc>
    </div>
  </template>
</tp-html-viewer>
