<tp-html-viewer label="tp-include" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-include src="/docs/components/include/examples/welcome.html" loading="Loading the shared notice…"></tp-include>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/include/include.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-include");
      element1.setAttribute("src", "/docs/components/include/examples/welcome.html");
      element1.setAttribute("loading", "Loading the shared notice…");
      example.append(element1);

      document.body.append(example);
      </script>
    </div>
  </template>
</tp-html-viewer>
