<tp-html-viewer label="tp-html-viewer" allow-script preserve-source>
  <template>
    <div role="example" label="Basic usage">
      <tp-html-viewer>
        <script type="tp/html">
      <h2>Hello, HTML!</h2>
      <p>This preview renders <strong>HTML content</strong>.</p>
        </script>
      </tp-html-viewer>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/html-viewer/html-viewer.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-html-viewer");
      element1.append(document.createTextNode("\n  "));

      const element2 = document.createElement("script");
      element2.setAttribute("type", "tp/html");
      element2.textContent = "\n\u003ch2>Hello, HTML!\u003c/h2>\n\u003cp>This preview renders \u003cstrong>HTML content\u003c/strong>.\u003c/p>\n  ";
      element1.append(element2);
      element1.append(document.createTextNode("\n"));
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="Multiple examples">
      <tp-html-viewer>
            <script type="tp/html">
              <div role="example" label="Paragraph">
                <p>A paragraph with <strong>strong text</strong>.</p>
              </div>
              <div role="example" label="Button">
                <button type="button">Continue</button>
              </div>
            </script>
          </tp-html-viewer>
    </div>

    <div role="example" label="Compare presentation modes">
      <section>
      <h3>mode="default" — Standard controls</h3>
      <p>Open Code to edit the source, then click Run or press <kbd>Shift</kbd>+<kbd>Enter</kbd> in the editor.</p>
      <tp-html-viewer mode="default">
        <script type="tp/html">
      <h2>Viewer modes</h2>
      <p>Change this message, then run the source.</p>
        </script>
      </tp-html-viewer>
      </section>

      <section>
      <h3>mode="lite" — Compact controls</h3>
      <p>Open Code to edit the source, then click Run or press <kbd>Shift</kbd>+<kbd>Enter</kbd> in the editor.</p>
      <tp-html-viewer mode="lite">
        <script type="tp/html">
      <h2>Viewer modes</h2>
      <p>Change this message, then run the source.</p>
        </script>
      </tp-html-viewer>
      </section>

      <section>
      <h3>mode="simple" — Editor and rendered output only</h3>
      <p>Edit the code below, keep the cursor in the editor and press <kbd>Shift</kbd>+<kbd>Enter</kbd> (Return) to run it. This viewer has no Run button.</p>
      <tp-html-viewer mode="simple">
        <script type="tp/html">
      <h2>Viewer modes</h2>
      <p>Change this message, then run the source.</p>
        </script>
      </tp-html-viewer>
      </section>
    </div>
  </template>
</tp-html-viewer>
