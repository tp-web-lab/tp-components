<tp-html-viewer label="tp-html-viewer" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-html-viewer>
        <script type="tp/html">
      <h2>Hello, HTML!</h2>
      <p>This preview renders <strong>HTML content</strong>.</p>
        </script>
      </tp-html-viewer>
    </div>

    <div role="example" label="Multiple examples">
      <tp-html-viewer>
            <script type="tp/html">
              <div role="example" label="Paragraph">
                <p>A paragraph with <strong>strong text</strong>.</p>
              </div>
              <div role="example" label="Button">
                <button type="button">Continue</button>
              </div>
            </script>
          </tp-html-viewer>
    </div>
  </template>
</tp-html-viewer>
