<tp-html-viewer label="tp-javascript-viewer" allow-script preserve-source>
  <template>
    <div role="example" label="Basic usage">
      <tp-javascript-viewer src="/docs/components/_shared/intro-projects/javascript.json"></tp-javascript-viewer>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/javascript/javascript.js";
      import "/components/javascript-viewer/javascript-viewer.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-javascript-viewer");
      element1.setAttribute("src", "/docs/components/_shared/intro-projects/javascript.json");
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="src">
      <tp-javascript-viewer src="/docs/components/javascript-viewer/examples/example.json"></tp-javascript-viewer>
    </div>

    <div role="example" label="script">
      <tp-javascript-viewer>
            <script type="tp/javascript">
              const app = document.querySelector('#app');

              if (app instanceof HTMLElement) {
                app.textContent = 'Hello JavaScript viewer';
              }

              console.log('Hello JavaScript');
            </script>
          </tp-javascript-viewer>
    </div>

    <div role="example" label="error">
      <tp-javascript-viewer>
            <script type="tp/javascript">
              console.error(new Error('Intentional JavaScript error'));
            </script>
          </tp-javascript-viewer>
    </div>

    <div role="example" label="Single source file">
      <tp-javascript-viewer src="/docs/components/_shared/single-source/example.js"></tp-javascript-viewer>
    </div>

    <div role="example" label="Compare presentation modes">
      <section>
      <h3>mode="default" — Standard controls</h3>
      <p>Open Code to edit the source, then click Run or press <kbd>Shift</kbd>+<kbd>Enter</kbd> in the editor.</p>
      <p>Run to print a console message followed by an intentional error. In simple mode the console opens automatically. Comment out the message statements and run again to check that the error alone opens it; remove the error statement to try a successful run.</p>
      <tp-javascript-viewer mode="default">
        <script type="tp/javascript" filename="main.js">
      document.body.innerHTML = "<p>The program ran.</p>";
      console.log("Console message before the intentional error.");
      throw new Error("Intentional error: the simple-mode console opens automatically.");
        </script>
      </tp-javascript-viewer>
      </section>

      <section>
      <h3>mode="lite" — Compact controls</h3>
      <p>Open Code to edit the source, then click Run or press <kbd>Shift</kbd>+<kbd>Enter</kbd> in the editor.</p>
      <p>Run to print a console message followed by an intentional error. In simple mode the console opens automatically. Comment out the message statements and run again to check that the error alone opens it; remove the error statement to try a successful run.</p>
      <tp-javascript-viewer mode="lite">
        <script type="tp/javascript" filename="main.js">
      document.body.innerHTML = "<p>The program ran.</p>";
      console.log("Console message before the intentional error.");
      throw new Error("Intentional error: the simple-mode console opens automatically.");
        </script>
      </tp-javascript-viewer>
      </section>

      <section>
      <h3>mode="simple" — Editor and rendered output only</h3>
      <p>Edit the code below, keep the cursor in the editor and press <kbd>Shift</kbd>+<kbd>Enter</kbd> (Return) to run it. This viewer has no Run button.</p>
      <p>Run to print a console message followed by an intentional error. In simple mode the console opens automatically. Comment out the message statements and run again to check that the error alone opens it; remove the error statement to try a successful run.</p>
      <tp-javascript-viewer mode="simple">
        <script type="tp/javascript" filename="main.js">
      document.body.innerHTML = "<p>The program ran.</p>";
      console.log("Console message before the intentional error.");
      throw new Error("Intentional error: the simple-mode console opens automatically.");
        </script>
      </tp-javascript-viewer>
      </section>
      <p>Programming viewers already have compact controls, so default and lite look alike. The first run may load the language engine.</p>
    </div>
  </template>
</tp-html-viewer>
