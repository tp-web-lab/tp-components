<tp-html-viewer label="tp-javascript-viewer" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-javascript-viewer src="/docs/components/_shared/intro-projects/javascript.json"></tp-javascript-viewer>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/javascript-viewer/javascript-viewer.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-javascript-viewer");
      element1.setAttribute("src", "/docs/components/_shared/intro-projects/javascript.json");
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="src">
      <tp-javascript-viewer src="/docs/components/javascript-viewer/examples/example.json"></tp-javascript-viewer>
    </div>

    <div role="example" label="script">
      <tp-javascript-viewer>
            <script type="tp/javascript">
              const app = document.querySelector('#app');

              if (app instanceof HTMLElement) {
                app.textContent = 'Hello JavaScript viewer';
              }

              console.log('Hello JavaScript');
            </script>
          </tp-javascript-viewer>
    </div>

    <div role="example" label="error">
      <tp-javascript-viewer>
            <script type="tp/javascript">
              console.error(new Error('Intentional JavaScript error'));
            </script>
          </tp-javascript-viewer>
    </div>

    <div role="example" label="Single source file">
      <tp-javascript-viewer src="/docs/components/_shared/single-source/example.js"></tp-javascript-viewer>
    </div>
  </template>
</tp-html-viewer>
