<tp-html-viewer label="tp-timefield" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-timefield label="Time" value="14:30" clearable=""></tp-timefield>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/timefield/timefield.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-timefield");
      element1.setAttribute("label", "Time");
      element1.setAttribute("value", "14:30");
      element1.setAttribute("clearable", "");
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="Inline named field">
      <p>Value: <tp-timefield name="identifier" value="14:30" placeholder="Enter a value"></tp-timefield></p>
    </div>
  </template>
</tp-html-viewer>
