<tp-html-viewer label="tp-callout" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-callout variant="info" heading="Information">
        The workshop starts at 9:00.
      </tp-callout>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/callout/callout.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-callout");
      element1.setAttribute("variant", "info");
      element1.setAttribute("heading", "Information");
      element1.append(document.createTextNode("\n  The workshop starts at 9:00.\n"));
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="Dismissible notice">
      <tp-callout variant="success" heading="Saved" closable="">Your changes have been saved.</tp-callout>
    </div>

    <div role="example" label="Outlined warning">
      <tp-callout variant="warning" heading="Before leaving" outlined="">Save your work before closing this page.</tp-callout>
    </div>
  </template>
</tp-html-viewer>
