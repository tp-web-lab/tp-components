<tp-html-viewer label="tp-callout" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-callout variant="info" heading="Information">
        The workshop starts at 9:00.
      </tp-callout>
    </div>

    <div role="example" label="Dismissible notice">
      <tp-callout variant="success" heading="Saved" closable="">Your changes have been saved.</tp-callout>
    </div>

    <div role="example" label="Outlined warning">
      <tp-callout variant="warning" heading="Before leaving" outlined="">Save your work before closing this page.</tp-callout>
    </div>
  </template>
</tp-html-viewer>
