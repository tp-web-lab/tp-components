<tp-html-viewer label="tp-box" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-box>
            The custom HTML element <code>&lt;tp-box&gt;</code> wraps its content in various ways.
          </tp-box>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>
      <tp-checkbox-list id="attributes-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value=""><ul><li>invert</li></ul></tp-checkbox-list>

      <tp-cluster><tp-textfield data-setting="border-radius" label="border-radius" value="0px" placeholder="0px" clearable></tp-textfield>
      <tp-textfield data-setting="border-width" label="border-width" value="1px" placeholder="1px" clearable></tp-textfield>
      <tp-textfield data-setting="padding" label="padding" value="1rem" placeholder="1rem" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="box attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/docs/components/box/examples/attributes.js"></script>
    </div>
  </template>
</tp-html-viewer>
