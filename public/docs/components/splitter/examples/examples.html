<tp-html-viewer label="tp-splitter" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-splitter position="40%">
        <dl>
          <dt>start</dt><dd><tp-box>Drag the divider to resize this panel.</tp-box></dd>
          <dt>end</dt><dd><tp-box>This panel uses the remaining space.</tp-box></dd>
        </dl>
      </tp-splitter>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>

      <tp-radio-list data-setting="axis" label="axis" label-position="top" orientation="horizontal" value="1"><ul><li>horizontal</li><li>vertical</li></ul></tp-radio-list>
      <tp-cluster><tp-textfield data-setting="position" label="position" value="50%" placeholder="50%" clearable></tp-textfield>
      <tp-textfield data-setting="storage-key" label="storage-key" value="" placeholder="" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="splitter attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/docs/components/splitter/examples/attributes.js"></script>
    </div>

    <div role="example" label="Nested splitters">
      <p>Drag the outer divider left or right, then drag the inner divider up or down. Focus either divider to resize its panels with the arrow keys.</p>
      <tp-splitter axis="horizontal" position="30%" style="height: 20rem">
        <dl>
          <dt>start</dt>
          <dd><tp-box><h3>Navigation</h3><p>This panel is resized by the outer divider.</p></tp-box></dd>
          <dt>end</dt>
          <dd>
            <tp-splitter axis="vertical" position="55%" style="height: 100%">
              <dl>
                <dt>start</dt>
                <dd><tp-box><h3>Editor</h3><p>The inner divider changes the height of this panel.</p></tp-box></dd>
                <dt>end</dt>
                <dd><tp-box><h3>Preview</h3><p>This panel uses the remaining height.</p></tp-box></dd>
              </dl>
            </tp-splitter>
          </dd>
        </dl>
      </tp-splitter>
    </div>
  </template>
</tp-html-viewer>
