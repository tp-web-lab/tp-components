<tp-html-viewer label="tp-tangram" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-tangram></tp-tangram>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/tangram/tangram.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-tangram");
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="Named vertices">
      <tp-tangram>
      <script type="tp/tangram">
      # Corners of a square of side 4
      point A = (0, 0)
      point B = (4, 0)
      point C = (4, 4)
      point D = (0, 4)

      # Shared landmarks
      point O = midpoint(A, C)
      point E = midpoint(B, C)
      point F = midpoint(C, D)
      point G = midpoint(B, O)
      point H = midpoint(O, C)
      point I = midpoint(O, D)

      # The seven pieces, described by their boundary vertices
      triangle A B O
      triangle A O D
      triangle E C F
      triangle B E G
      triangle O H I
      square O G E H
      parallelogram D F H I
      </script>
      </tp-tangram>
    </div>
