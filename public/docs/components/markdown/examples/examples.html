<tp-html-viewer label="tp-markdown" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-markdown>
        <script type="tp/markdown">
      ## A short document

      This paragraph uses **Markdown**.

      - Write content
      - Add components
      - Publish the page
        </script>
      </tp-markdown>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/markdown/markdown.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-markdown");
      element1.append(document.createTextNode("\n  "));

      const element2 = document.createElement("script");
      element2.setAttribute("type", "tp/markdown");
      element2.textContent = "\n## A short document\n\nThis paragraph uses **Markdown**.\n\n- Write content\n- Add components\n- Publish the page\n  ";
      element1.append(element2);
      element1.append(document.createTextNode("\n"));
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="Mathematical notation">
      <tp-markdown>
            <script type="tp/markdown">
            AsciiMath
            : Inline equation: :asciimath:`x=(-b +- sqrt(b^2 – 4ac))/(2a)`
            : Display equation:
              ```asciimath
              sum_(i=1)^n i^3=((n(n+1))/2)^2
              ```

            Latex
            : Inline equation: :latexmath:`E = mc^2`
            : Display equation:
              ```latexmath
              \begin{eqnarray}
              \hat{f}(\xi)&=&\frac{1}{\sqrt{2\pi}}\int_{-\infty}^{\infty}e^{-|x|}e^{-ix\xi}dx\\
              &=&\frac{1}{\sqrt{2\pi}}\int_{0}^{\infty}e^{-x-ix\xi}dx+\int_{-\infty}^0e^{x-ix\xi}dx\\
              &=&\frac{1}{\sqrt{2\pi}}\int_{0}^{\infty}(e^{-x-ix\xi}-e^{-x+ix\xi})dx\\
              &=&\frac{1}{\sqrt{2\pi}}[\frac{1}{-(1+i\xi)}(-1)-\frac{1}{-1+i\xi}(-1)]\\
              &=&\frac{1}{\sqrt{2\pi}}[\frac{1-i\xi}{1+\xi^2}+\frac{-(1+i\xi)}{1+\xi^2}]\\
              &=&\frac{1}{\sqrt{2\pi}}\frac{-2i\xi}{1+\xi^2}\\
              &=&-\sqrt{\frac{2}{\pi}}\frac{i\xi}{1+\xi^2}
              \end{eqnarray}
              ```
            </script>
            </tp-markdown>
    </div>
  </template>
</tp-html-viewer>
