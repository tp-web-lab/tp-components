<tp-html-viewer label="tp-crossword" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-crossword>
        <dl>
          <dt>solution</dt><dd><ol><li>BALL</li><li>AREA</li><li>LEAD</li><li>LADY</li></ol></dd>
          <dt>across</dt><dd><ol><li>A. A round toy used in many sports</li><li>B. The size of a surface</li><li>C. A heavy metal</li><li>D. A polite word for a woman</li></ol></dd>
          <dt>down</dt><dd><ol><li>1. A round toy used in many sports</li><li>2. The size of a surface</li><li>3. A heavy metal</li><li>4. A polite word for a woman</li></ol></dd>
        </dl>
      </tp-crossword>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>
      <tp-checkbox-list id="attributes-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value=""><ul><li>silent</li></ul></tp-checkbox-list>

      <tp-cluster><tp-textfield data-setting="data-crossword-puzzle" label="data-crossword-puzzle" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="data-crossword-silent" label="data-crossword-silent" value="false" placeholder="false" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="crossword attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/docs/components/crossword/examples/attributes.js"></script>
    </div>
  </template>
</tp-html-viewer>
