<tp-html-viewer label="tp-single-choice-question" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-single-choice-question answer="1" random="">
          <dl>
            <dt>Title</dt><dd>Geography</dd>
            <dt>Prompt</dt><dd>What is the capital of France?</dd>
            <dt>Form</dt><dd><ul><li>Paris</li><li>London</li><li>Berlin</li></ul></dd>
            <dt>Feedback</dt><dd><ul><li>Correct.</li><li>London is in the UK.</li><li>Berlin is in Germany.</li></ul></dd>
            <dt>Solution</dt><dd>Paris</dd>
          </dl>
        </tp-single-choice-question>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>
      <tp-checkbox-list id="attributes-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value=""><ul><li>random</li></ul></tp-checkbox-list>
      <tp-radio-list data-setting="orientation" label="orientation" label-position="top" orientation="horizontal" value="1"><ul><li>Default (empty)</li><li>horizontal</li><li>vertical</li></ul></tp-radio-list>
      <tp-radio-list data-setting="src" label="src" label-position="top" orientation="horizontal" value="1"><ul><li>Default</li><li>file1</li><li>file2</li><li>file-unknown</li></ul></tp-radio-list>
      <tp-cluster><tp-textfield data-setting="answer" label="answer" value="0" placeholder="0" clearable></tp-textfield>
      <tp-textfield data-setting="name" label="name" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="value" label="value" value="" placeholder="" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="single-choice-question attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>
      <p>File-loading attributes offer only Default, file1, file2 and file-unknown. The two local fixtures preserve verified example formats (they may contain the same content); file-unknown deliberately exercises error handling. No arbitrary path can be entered.</p>
      <script type="module" src="/docs/components/single-choice-question/examples/attributes.js"></script>
    </div>

    <div role="example" label="Derivative of tan(x)">
      <tp-single-choice-question answer="2" random="" lang="en">
        <dl>
          <dt>Title</dt><dd>Derivative of the tangent function</dd>
          <dt>Prompt</dt><dd>What is the derivative of \(f(x) = \tan(x)\) at a point where \(\cos(x) \ne 0\)?</dd>
          <dt>Form</dt><dd><ul><li>\(\cos^{2}(x)\)</li><li>\(\displaystyle \frac{1}{\cos^{2}(x)}\)</li><li>\(\displaystyle -\frac{1}{\sin^{2}(x)}\)</li><li>\(\displaystyle \frac{1}{\tan^{2}(x)}\)</li></ul></dd>
          <dt>Feedback</dt><dd><ul>
            <li>The square of the cosine belongs in the denominator.</li>
            <li>Correct. Apply the quotient rule to sine divided by cosine.</li>
            <li>This is the derivative of the cotangent, not the tangent.</li>
            <li>The reciprocal square of the tangent is not its derivative.</li>
          </ul></dd>
          <dt>Solution</dt><dd>\(\displaystyle f'(x) = \frac{1}{\cos^{2}(x)} = 1 + \tan^{2}(x)\), wherever \(\cos(x) \ne 0\).</dd>
        </dl>
      </tp-single-choice-question>
      <script>
        // Wait for the question and its radio controls before typesetting the live content.
        window.MathJax = {
          svg: { fontCache: "local" },
          startup: {
            pageReady: async () => {
              await customElements.whenDefined("tp-single-choice-question");
              await customElements.whenDefined("tp-radio-list");
              return MathJax.startup.defaultPageReady();
            }
          }
        };
      </script>
      <script defer="" src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js"></script>
    </div>

    <div role="example" label="Regular heptagon">
      <tp-single-choice-question answer="3" random="" lang="en">
        <dl>
          <dt>Title</dt><dd>Recognize a regular heptagon</dd>
          <dt>Prompt</dt><dd>Which figure is a regular heptagon? Select the polygon with seven equal sides and seven equal interior angles.</dd>
          <dt>Form</dt><dd><ul><li><img src="/docs/components/single-choice-question/examples/pentagon.svg" alt="Regular polygon with 5 sides" width="120" height="120"></li><li><img src="/docs/components/single-choice-question/examples/hexagon.svg" alt="Regular polygon with 6 sides" width="120" height="120"></li><li><img src="/docs/components/single-choice-question/examples/heptagon.svg" alt="Regular polygon with 7 sides" width="120" height="120"></li><li><img src="/docs/components/single-choice-question/examples/octagon.svg" alt="Regular polygon with 8 sides" width="120" height="120"></li><li><img src="/docs/components/single-choice-question/examples/nonagon.svg" alt="Regular polygon with 9 sides" width="120" height="120"></li></ul></dd>
          <dt>Feedback</dt><dd><ul>
            <li>This pentagon has five sides.</li>
            <li>This hexagon has six sides.</li>
            <li>Correct. This heptagon has seven equal sides and seven equal interior angles.</li>
            <li>This octagon has eight sides.</li>
            <li>This nonagon has nine sides.</li>
          </ul></dd>
          <dt>Solution</dt><dd>The regular heptagon is the polygon with seven equal sides and seven equal interior angles.</dd>
        </dl>
      </tp-single-choice-question>
    </div>
  </template>
</tp-html-viewer>
