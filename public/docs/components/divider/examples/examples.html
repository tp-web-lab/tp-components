<tp-html-viewer label="tp-divider" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-box>
            <p>Primary content group.</p>
            <tp-divider></tp-divider>
            <p>Secondary content group.</p>
          </tp-box>
    </div>

    <div role="example" label="Custom style">
      <style>
            .divider-custom-style tp-divider {
              --tp-divider-color: var(--tp-brand-fill-mid);
              --tp-divider-thickness: 4px;
              --tp-divider-margin-block: 0.75rem;
            }
          </style>
          <tp-box>
            <div class="divider-custom-style">
              <p>Before the custom divider.</p>
              <tp-divider></tp-divider>
            </div>
            <p>After the custom divider.</p>
          </tp-box>
    </div>

    <div role="example" label="Dropdown menu">
      <tp-dropdown open="">
            <ul>
              <li>Load</li>
              <tp-divider></tp-divider>
              <li>Save</li>
            </ul>
          </tp-dropdown>
    </div>
  </template>
</tp-html-viewer>
