<tp-html-viewer label="tp-listof" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <div data-tp-reference-scope="">
        <tp-listof selector="figure"></tp-listof>
        <figure><p>A diagram of the water cycle.</p><figcaption>The water cycle</figcaption></figure>
        <figure><p>A diagram of a food chain.</p><figcaption>A food chain</figcaption></figure>
      </div>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/listof/listof.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("div");
      element1.setAttribute("data-tp-reference-scope", "");
      element1.append(document.createTextNode("\n  "));

      const element2 = document.createElement("tp-listof");
      element2.setAttribute("selector", "figure");
      element1.append(element2);
      element1.append(document.createTextNode("\n  "));

      const element3 = document.createElement("figure");

      const element4 = document.createElement("p");
      element4.append(document.createTextNode("A diagram of the water cycle."));
      element3.append(element4);

      const element5 = document.createElement("figcaption");
      element5.append(document.createTextNode("The water cycle"));
      element3.append(element5);
      element1.append(element3);
      element1.append(document.createTextNode("\n  "));

      const element6 = document.createElement("figure");

      const element7 = document.createElement("p");
      element7.append(document.createTextNode("A diagram of a food chain."));
      element6.append(element7);

      const element8 = document.createElement("figcaption");
      element8.append(document.createTextNode("A food chain"));
      element6.append(element8);
      element1.append(element6);
      element1.append(document.createTextNode("\n"));
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="Notes, bibliography and glossary">
      <div data-tp-reference-scope="">
      <p>Read a note <tp-ref href="^method"></tp-ref>, consult a source <tp-ref href="@book"></tp-ref>, or look up <tp-ref href="%ecosystem"></tp-ref>. Compare another note <tp-ref href="^weather"></tp-ref>, then read the first note again <tp-ref href="^method"></tp-ref>.</p>
      <tp-note ref="method" title="Method"><p>Observe the habitat at <strong>three different times</strong> of day.</p><ul><li>Record the weather.</li><li>Compare your observations.</li></ul></tp-note>
      <tp-biblio ref="book" title="Book"><p>Alex Example. <em>Field observation handbook</em>. Example Press, 2026.</p></tp-biblio>
      <tp-glossary ref="ecosystem" title="Ecosystem"><p>A community of organisms interacting with their physical environment.</p></tp-glossary>
      <tp-note ref="weather"><p>Record the temperature and cloud cover.</p></tp-note>
      <tp-biblio ref="atlas"><p>Alex Example. <em>A field atlas</em>. Example Press, 2025.</p></tp-biblio>
      <tp-glossary ref="community"><p>A group of interacting populations.</p></tp-glossary>
      <h3>Notes</h3><tp-listof selector="tp-note"></tp-listof>
      <h3>Bibliography</h3><tp-listof selector="tp-biblio"></tp-listof>
      <h3>Glossary</h3><tp-listof selector="tp-glossary"></tp-listof>
      </div>
    </div>
  </template>
</tp-html-viewer>
