<tp-html-viewer label="tp-prolog-viewer" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-prolog-viewer src="/docs/components/_shared/intro-projects/prolog.json"></tp-prolog-viewer>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/prolog-viewer/prolog-viewer.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-prolog-viewer");
      element1.setAttribute("src", "/docs/components/_shared/intro-projects/prolog.json");
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="src">
      <tp-prolog-viewer src="/docs/components/prolog-viewer/examples/example.json"></tp-prolog-viewer>
    </div>

    <div role="example" label="script without filename">
      <tp-prolog-viewer>
            <script type="tp/prolog">
              parent(ada, byron).
              parent(byron, charles).

              grandparent(Grandparent, Grandchild) :-
                parent(Grandparent, Parent),
                parent(Parent, Grandchild).
            </script>
          </tp-prolog-viewer>
    </div>

    <div role="example" label="scripts with filename">
      <tp-prolog-viewer>
            <script type="tp/prolog" filename="program.pl">
              parent(ada, byron).
              parent(byron, charles).

              grandparent(Grandparent, Grandchild) :-
                parent(Grandparent, Parent),
                parent(Parent, Grandchild).
            </script>
            <script type="tp/prolog" filename="query.pl">
              grandparent(ada, Grandchild).
            </script>
          </tp-prolog-viewer>
    </div>

    <div role="example" label="error">
      <tp-prolog-viewer>
            <script type="tp/prolog" filename="query.pl">
              unknown_predicate(X).
            </script>
          </tp-prolog-viewer>
    </div>

    <div role="example" label="Single source file">
      <tp-prolog-viewer src="/docs/components/_shared/single-source/example.pl"></tp-prolog-viewer>
    </div>
  </template>
</tp-html-viewer>
