<tp-html-viewer label="tp-restructuredtext-viewer" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-restructuredtext-viewer>
              <script type="tp/restructuredtext">
                Live reStructuredText
                =====================

                Edit this source and select **Run**.

                * First item
                * Second item
              </script>
            </tp-restructuredtext-viewer>
    </div>

    <div role="example" label="Multiple examples">
      <tp-restructuredtext-viewer>
              <script type="tp/restructuredtext">
                .. example:: Paragraph and list

                   A paragraph with **strong text** and *emphasis*.

                   * Alpha
                   * Beta

                .. example:: Table

                   ================  =================
                   Language          Purpose
                   ================  =================
                   reStructuredText  Technical writing
                   HTML              Web documents
                   ================  =================
              </script>
            </tp-restructuredtext-viewer>
    </div>
  </template>
</tp-html-viewer>
