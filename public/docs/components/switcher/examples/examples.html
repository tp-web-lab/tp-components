<tp-html-viewer label="tp-switcher" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-switcher threshold="35rem" gap="1rem">
        <tp-box>1. Plan the content.</tp-box>
        <tp-box>2. Write a draft.</tp-box>
        <tp-box>3. Review the text.</tp-box>
        <tp-box>4. Add illustrations.</tp-box>
        <tp-box>5. Publish the result.</tp-box>
      </tp-switcher>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>


      <tp-cluster><tp-textfield data-setting="gap" label="gap" value="1rem" placeholder="1rem" clearable></tp-textfield>
      <tp-textfield data-setting="max-horizontal" label="max-horizontal" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="threshold" label="threshold" value="30rem" placeholder="30rem" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="switcher attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/docs/components/switcher/examples/attributes.js"></script>
    </div>
  </template>
</tp-html-viewer>
