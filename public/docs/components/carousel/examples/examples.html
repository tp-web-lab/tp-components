<tp-html-viewer label="tp-carousel" allow-script preserve-source>
  <template>
    <div role="example" label="Basic usage">
      <tp-carousel aria-label="Outdoor activities" height="18rem">
        <img src="/docs/medias/images/canoe.svg" alt="Canoe">
        <img src="/docs/medias/images/basketball.svg" alt="Basketball">
        <img src="/docs/medias/images/walking-shoe.svg" alt="Walking shoe">
      </tp-carousel>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/carousel/carousel.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-carousel");
      element1.setAttribute("aria-label", "Outdoor activities");
      element1.setAttribute("height", "18rem");
      element1.append(document.createTextNode("\n  "));

      const element2 = document.createElement("img");
      element2.setAttribute("src", "/docs/medias/images/canoe.svg");
      element2.setAttribute("alt", "Canoe");
      element1.append(element2);
      element1.append(document.createTextNode("\n  "));

      const element3 = document.createElement("img");
      element3.setAttribute("src", "/docs/medias/images/basketball.svg");
      element3.setAttribute("alt", "Basketball");
      element1.append(element3);
      element1.append(document.createTextNode("\n  "));

      const element4 = document.createElement("img");
      element4.setAttribute("src", "/docs/medias/images/walking-shoe.svg");
      element4.setAttribute("alt", "Walking shoe");
      element1.append(element4);
      element1.append(document.createTextNode("\n"));
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="Vertical navigation">
      <tp-carousel orientation="vertical" aria-label="Outdoor activities" height="18rem">
        <img src="/docs/medias/images/canoe.svg" alt="Canoe">
        <img src="/docs/medias/images/basketball.svg" alt="Basketball">
        <img src="/docs/medias/images/walking-shoe.svg" alt="Walking shoe">
      </tp-carousel>
    </div>

    <div role="example" label="Looping navigation">
      <tp-carousel loop="" index="2" aria-label="Outdoor activities" height="18rem">
        <img src="/docs/medias/images/canoe.svg" alt="Canoe">
        <img src="/docs/medias/images/basketball.svg" alt="Basketball">
        <img src="/docs/medias/images/walking-shoe.svg" alt="Walking shoe">
      </tp-carousel>
    </div>

    <div role="example" label="Automatic scrolling and hover pause">
      <p>Hover over the carousel to pause the movement. Move the pointer away to resume from the same position.</p>
      <tp-carousel auto="3000" transition="start-to-end" hide-controls aria-label="TP markup languages" height="3em">
        <figure><tp-icon name="tp-html-logo" library="tp" size="3em" role="img" aria-label="TP HTML"></tp-icon></figure>
        <figure><tp-icon name="tp-asciidoc-logo" library="tp" size="3em" role="img" aria-label="TP AsciiDoc"></tp-icon></figure>
        <figure><tp-icon name="tp-latex-logo" library="tp" size="3em" role="img" aria-label="TP LaTeX"></tp-icon></figure>
        <figure><tp-icon name="tp-markdown-logo" library="tp" size="3em" role="img" aria-label="TP Markdown"></tp-icon></figure>
        <figure><tp-icon name="tp-restructuredtext-logo" library="tp" size="3em" role="img" aria-label="TP reStructuredText"></tp-icon></figure>
      </tp-carousel>
    </div>
  </template>
</tp-html-viewer>
