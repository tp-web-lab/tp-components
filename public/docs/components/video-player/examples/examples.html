<tp-html-viewer label="tp-video-player" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-video-player src="/docs/components/video-player/examples/clip-1.mp4" controls="" label="Moving shapes"></tp-video-player>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/video-player/video-player.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-video-player");
      element1.setAttribute("src", "/docs/components/video-player/examples/clip-1.mp4");
      element1.setAttribute("controls", "");
      element1.setAttribute("label", "Moving shapes");
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="YouTube video">
      <tp-video-player src="https://www.youtube.com/watch?v=4n0M4YRAVjc" controls="" label="Virtual reality introduction"></tp-video-player>
    </div>
  </template>
</tp-html-viewer>
