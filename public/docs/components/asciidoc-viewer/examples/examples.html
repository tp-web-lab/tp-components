<tp-html-viewer label="tp-asciidoc-viewer" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-asciidoc-viewer>
              <script type="tp/asciidoc">
                = Live AsciiDoc
                :showtitle:

                Edit this source and select *Run*.
              </script>
            </tp-asciidoc-viewer>
    </div>

    <div role="example" label="Multiple examples">
      <tp-asciidoc-viewer>
              <script type="tp/asciidoc">
                .Paragraph and list
                ====
                A paragraph with *strong text* and _emphasis_.

                * Alpha
                * Beta
                ====

                .Table
                ====
                |===
                | Language | Purpose

                | AsciiDoc
                | Technical writing

                | HTML
                | Web documents
                |===
                ====
              </script>
            </tp-asciidoc-viewer>
    </div>
  </template>
</tp-html-viewer>
