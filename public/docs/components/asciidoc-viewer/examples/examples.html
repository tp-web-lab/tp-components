<tp-html-viewer label="tp-asciidoc-viewer" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-asciidoc-viewer>
              <script type="tp/asciidoc">
                = Live AsciiDoc
                :showtitle:

                Edit this source and select *Run*.
              </script>
            </tp-asciidoc-viewer>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/asciidoc/asciidoc.js";
      import "/components/asciidoc-viewer/asciidoc-viewer.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-asciidoc-viewer");
      element1.append(document.createTextNode("\n        "));

      const element2 = document.createElement("script");
      element2.setAttribute("type", "tp/asciidoc");
      element2.textContent = "\n          = Live AsciiDoc\n          :showtitle:\n\n          Edit this source and select *Run*.\n        ";
      element1.append(element2);
      element1.append(document.createTextNode("\n      "));
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="Multiple examples">
      <tp-asciidoc-viewer>
              <script type="tp/asciidoc">
                .Paragraph and list
                ====
                A paragraph with *strong text* and _emphasis_.

                * Alpha
                * Beta
                ====

                .Table
                ====
                |===
                | Language | Purpose

                | AsciiDoc
                | Technical writing

                | HTML
                | Web documents
                |===
                ====
              </script>
            </tp-asciidoc-viewer>
    </div>
  </template>
</tp-html-viewer>
