<tp-html-viewer label="tp-asciidoc-viewer" allow-script preserve-source>
  <template>
    <div role="example" label="Basic usage">
      <tp-asciidoc-viewer>
              <script type="tp/asciidoc">
                = Live AsciiDoc
                :showtitle:

                Edit this source and select *Run*.
              </script>
            </tp-asciidoc-viewer>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/asciidoc/asciidoc.js";
      import "/components/asciidoc-viewer/asciidoc-viewer.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-asciidoc-viewer");
      element1.append(document.createTextNode("\n        "));

      const element2 = document.createElement("script");
      element2.setAttribute("type", "tp/asciidoc");
      element2.textContent = "\n          = Live AsciiDoc\n          :showtitle:\n\n          Edit this source and select *Run*.\n        ";
      element1.append(element2);
      element1.append(document.createTextNode("\n      "));
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="Multiple examples">
      <tp-asciidoc-viewer>
              <script type="tp/asciidoc">
                .Paragraph and list
                ====
                A paragraph with *strong text* and _emphasis_.

                * Alpha
                * Beta
                ====

                .Table
                ====
                |===
                | Language | Purpose

                | AsciiDoc
                | Technical writing

                | HTML
                | Web documents
                |===
                ====
              </script>
            </tp-asciidoc-viewer>
    </div>

    <div role="example" label="Compare presentation modes">
      <section>
      <h3>mode="default" — Standard controls</h3>
      <p>Open Code to edit the source, then click Run or press <kbd>Shift</kbd>+<kbd>Enter</kbd> in the editor.</p>
      <tp-asciidoc-viewer mode="default">
        <script type="tp/asciidoc">
      == Viewer modes

      Change this *message*, then run the source.
        </script>
      </tp-asciidoc-viewer>
      </section>

      <section>
      <h3>mode="lite" — Compact controls</h3>
      <p>Open Code to edit the source, then click Run or press <kbd>Shift</kbd>+<kbd>Enter</kbd> in the editor.</p>
      <tp-asciidoc-viewer mode="lite">
        <script type="tp/asciidoc">
      == Viewer modes

      Change this *message*, then run the source.
        </script>
      </tp-asciidoc-viewer>
      </section>

      <section>
      <h3>mode="simple" — Editor and rendered output only</h3>
      <p>Edit the code below, keep the cursor in the editor and press <kbd>Shift</kbd>+<kbd>Enter</kbd> (Return) to run it. This viewer has no Run button.</p>
      <tp-asciidoc-viewer mode="simple">
        <script type="tp/asciidoc">
      == Viewer modes

      Change this *message*, then run the source.
        </script>
      </tp-asciidoc-viewer>
      </section>
    </div>
  </template>
</tp-html-viewer>
