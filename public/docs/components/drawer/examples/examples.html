<tp-html-viewer label="tp-drawer" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-box data-intro-action="drawer" data-allow-script="">
        <tp-button id="intro-drawer-trigger" data-demo-trigger="">Open the drawer</tp-button>
        <tp-drawer label="Example drawer" backdrop="" outside-click=""><p>This panel contains additional information.</p><tp-button data-demo-close="">Close</tp-button></tp-drawer>
        <p data-demo-status="" role="status">Try the drawer using its trigger.</p>
        <script src="/docs/components/_shared/introduction-actions.js"></script>
      </tp-box>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>
      <tp-checkbox-list id="attributes-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value=""><ul><li>backdrop</li><li>contained</li><li>open</li><li>outside-click</li></ul></tp-checkbox-list>
      <tp-radio-list data-setting="placement" label="placement" label-position="top" orientation="horizontal" value="2"><ul><li>top</li><li>end</li><li>bottom</li><li>start</li></ul></tp-radio-list>
      <tp-cluster><tp-textfield data-setting="label" label="label" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="width" label="width" value="min(24rem, 100vw)" placeholder="min(24rem, 100vw)" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="drawer attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/docs/components/drawer/examples/attributes.js"></script>
    </div>
  </template>
</tp-html-viewer>
