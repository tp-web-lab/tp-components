<tp-html-viewer label="tp-lorem-ipsum" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-lorem-ipsum length="1" words-per-sentence="8" sentences-per-paragraph="2" seed="42"></tp-lorem-ipsum>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>

      <tp-radio-list data-setting="type" label="type" label-position="top" orientation="horizontal" value="3"><ul><li>sentence</li><li>title</li><li>p</li><li>dl</li><li>ol</li><li>ul</li></ul></tp-radio-list>
      <tp-cluster><tp-textfield data-setting="length" label="length" value="3-5" placeholder="3-5" clearable></tp-textfield>
      <tp-textfield data-setting="seed" label="seed" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="sentences-per-paragraph" label="sentences-per-paragraph" value="3-6" placeholder="3-6" clearable></tp-textfield>
      <tp-textfield data-setting="words-per-sentence" label="words-per-sentence" value="4-16" placeholder="4-16" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="lorem-ipsum attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/docs/components/lorem-ipsum/examples/attributes.js"></script>
    </div>
  </template>
</tp-html-viewer>
