<tp-html-viewer label="tp-textfield" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-textfield label="Single line" placeholder="Type some text..." clearable=""></tp-textfield>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/textfield/textfield.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-textfield");
      element1.setAttribute("label", "Single line");
      element1.setAttribute("placeholder", "Type some text...");
      element1.setAttribute("clearable", "");
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="Inline named field">
      <p>Value: <tp-textfield name="identifier" value="Ada" placeholder="Enter a value"></tp-textfield></p>
    </div>

    <div role="example" label="Clearable search">
      <tp-textfield label="Search" value="Garden" clearable=""></tp-textfield>
    </div>
  </template>
</tp-html-viewer>
