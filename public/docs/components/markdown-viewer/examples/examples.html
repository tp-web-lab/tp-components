<tp-html-viewer label="tp-markdown-viewer" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-markdown-viewer>
            <script type="tp/markdown">
              # Live Markdown

              Edit this source and select **Run**.
            </script>
          </tp-markdown-viewer>
    </div>

    <div role="example" label="Multiple examples">
      <tp-markdown-viewer>
            <script type="tp/markdown">
              ``` example {label="Paragraph and list"}
              A paragraph with **strong text** and *emphasis*.

              - Alpha
              - Beta
              ```

              ``` example {label="Table"}
              | Language | Purpose |
              | --- | --- |
              | Markdown | Technical writing |
              | HTML | Web documents |
              ```
            </script>
          </tp-markdown-viewer>
    </div>
  </template>
</tp-html-viewer>
