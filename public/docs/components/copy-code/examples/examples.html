<tp-html-viewer label="tp-copy-code" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-box>
        <tp-box id="intro-copy-code"><pre><code>const answer = 6 * 7;</code></pre></tp-box>
        <tp-copy-code for="intro-copy-code"></tp-copy-code>
      </tp-box>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>


      <tp-cluster><tp-textfield data-setting="copied-text" label="copied-text" value="Copied!" placeholder="Copied!" clearable></tp-textfield>
      <tp-textfield data-setting="error-icon" label="error-icon" value="warning" placeholder="warning" clearable></tp-textfield>
      <tp-textfield data-setting="for" label="for" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="icon" label="icon" value="copy" placeholder="copy" clearable></tp-textfield>
      <tp-textfield data-setting="success-icon" label="success-icon" value="check" placeholder="check" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="copy-code attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/docs/components/copy-code/examples/attributes.js"></script>
    </div>
  </template>
</tp-html-viewer>
