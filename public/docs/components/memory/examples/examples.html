<tp-html-viewer label="tp-memory" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-memory label="Match the fruits">
        <ol><li>Apple</li><li>Pear</li><li>Plum</li></ol>
      </tp-memory>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/memory/memory.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-memory");
      element1.setAttribute("label", "Match the fruits");
      element1.append(document.createTextNode("\n  "));

      const element2 = document.createElement("ol");

      const element3 = document.createElement("li");
      element3.append(document.createTextNode("Apple"));
      element2.append(element3);

      const element4 = document.createElement("li");
      element4.append(document.createTextNode("Pear"));
      element2.append(element4);

      const element5 = document.createElement("li");
      element5.append(document.createTextNode("Plum"));
      element2.append(element5);
      element1.append(element2);
      element1.append(document.createTextNode("\n"));
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="Numbers 0 to 9">
      <tp-memory back="/medias/logos/logo-tp-components.svg">
              <ol>
                <li><tp-icon name="0" library="numbers" size="5em"></tp-icon></li>
                <li><tp-icon name="1" library="numbers" size="5em"></tp-icon></li>
