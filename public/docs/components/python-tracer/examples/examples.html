<tp-html-viewer label="tp-python-tracer" allow-script preserve-source>
  <template>
    <div role="example" label="Basic usage">
      <tp-python-tracer src="/docs/components/python-tracer/examples/students.py"></tp-python-tracer>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/python/python.js";
      import "/components/python-tracer/python-tracer.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-python-tracer");
      element1.setAttribute("src", "/docs/components/python-tracer/examples/students.py");
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="Subexpressions on one line">
      <tp-python-tracer src="/docs/components/python-tracer/examples/same-line.py"></tp-python-tracer>
    </div>

    <div role="example" label="Inline Python">
      <tp-python-tracer>
        <script type="tp/python">
          def factorial(n):
              if n <= 1:
                  return 1
              return n * factorial(n - 1)

          print(factorial(5))
        </script>
      </tp-python-tracer>
    </div>

    <div role="example" label="Replay a saved trace">
      <tp-python-tracer trace="/docs/components/python-tracer/examples/students.trace.json"></tp-python-tracer>
    </div>

    <div role="example" label="Save and reload">
      <p>Choose Save trace, name the JSON file, then choose Load trace to reopen it. Navigate to Last to see Ada 92.5 without running Python again.</p>
      <tp-python-tracer src="/docs/components/python-tracer/examples/students.py" trace="/docs/components/python-tracer/examples/students.trace.json"></tp-python-tracer>
    </div>

    <div role="example" label="Class and shared instance">
      <tp-python-tracer src="/docs/components/python-tracer/examples/counter.py"></tp-python-tracer>
    </div>

    <div role="example" label="Inheritance and super">
      <p>Follow StepCounter inheriting from Counter, super().__init__(value) and the overridden increment method calling super().increment(). Inspect self referring to the same instance in both classes; the output is 5, 7, True.</p>
      <tp-python-tracer src="/docs/components/python-tracer/examples/inheritance.py"></tp-python-tracer>
    </div>

    <div role="example" label="References between instances">
      <tp-python-tracer src="/docs/components/python-tracer/examples/linked-nodes.py"></tp-python-tracer>
    </div>

    <div role="example" label="Caught exception">
      <p>Record execution, then step through the exception and its handler. Output continues with caught and done.</p>
      <tp-python-tracer src="/docs/components/python-tracer/examples/caught-exception.py"></tp-python-tracer>
    </div>

    <div role="example" label="Uncaught exception">
      <p>Record execution and follow the exception from fail to the caller. The final event displays ValueError: test error; earlier steps remain available.</p>
      <tp-python-tracer src="/docs/components/python-tracer/examples/uncaught-exception.py"></tp-python-tracer>
    </div>

    <div role="example" label="Closure with nonlocal">
      <p>Record execution and follow count from 0 to 1 to 2 in the retained make_counter frame. The two calls share the same captured variable and print 1 then 2.</p>
      <tp-python-tracer src="/docs/components/python-tracer/examples/closure-nonlocal.py"></tp-python-tracer>
    </div>

    <div role="example" label="Nested lists and shared references">
      <p>Record execution and inspect the three arrows from rows: the first and third point to the same shared list. Step through append(5) to see both references reflect the change, while the middle list stays unchanged.</p>
      <tp-python-tracer src="/docs/components/python-tracer/examples/nested-lists.py"></tp-python-tracer>
    </div>
  </template>
</tp-html-viewer>
