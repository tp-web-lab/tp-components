<tp-html-viewer label="tp-source" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-box>
        <p>Open the source repository for this library.</p>
        <tp-source url="https://github.com/tp-web-lab/tp-components"></tp-source>
      </tp-box>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>


      <tp-cluster><tp-textfield data-setting="url" label="url" value="" placeholder="" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="source attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/docs/components/source/examples/attributes.js"></script>
    </div>

    <div role="example" label="Repository providers">
      <p>GitHub</p><tp-source url="https://github.com/tp-web-lab/tp-components"></tp-source><p>GitLab</p><tp-source url="https://gitlab.com"></tp-source><p>Generic Git address (illustrative)</p><tp-source url="https://example.com/project.git"></tp-source>
    </div>
  </template>
</tp-html-viewer>
