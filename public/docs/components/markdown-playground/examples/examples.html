<tp-html-viewer label="tp-markdown-playground" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-markdown-playground src="/docs/components/_shared/intro-projects/markdown.json"></tp-markdown-playground>
    </div>

    <div role="example" label="Javascript API">
      <script type="module">
      import "/components/markdown/markdown.js";
      import "/components/markdown-playground/markdown-playground.js";

      const example = document.createDocumentFragment();

      const element1 = document.createElement("tp-markdown-playground");
      element1.setAttribute("src", "/docs/components/_shared/intro-projects/markdown.json");
      example.append(element1);

      document.body.append(example);
      </script>
    </div>

    <div role="example" label="Single source file">
      <tp-markdown-playground src="/docs/components/_shared/single-source/example.md"></tp-markdown-playground>
    </div>
  </template>
</tp-html-viewer>
