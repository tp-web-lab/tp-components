<tp-html-viewer label="tp-badge" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <p>
        Build status: <tp-badge variant="success" pulse>Ready</tp-badge>
      </p>
    </div>

    <div role="example" label="With icon">
      <tp-badge outlined><tp-icon name="file_type_vite" library="languages"></tp-icon> Vite<tp-divider orientation="vertical"></tp-divider>8.1.5</tp-badge>
    </div>

    <div role="example" label="Status labels">
      <tp-badge variant="success">Complete</tp-badge> <tp-badge variant="warning">Pending</tp-badge>
    </div>
  </template>
</tp-html-viewer>
