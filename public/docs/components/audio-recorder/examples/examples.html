<tp-html-viewer label="tp-audio-recorder" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-audio-recorder></tp-audio-recorder>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>

      <p>Enter <code>#spoken-answer</code> in transcript, then use Record and Stop in the preview. Final recognized speech fills the editable Transcript field. Browser support and microphone permission are required; recognition may use an online service.</p>


      <tp-stack>


      <tp-cluster><tp-textfield data-setting="legend" label="legend" value="Audio recorder" placeholder="Audio recorder" clearable></tp-textfield>
      <tp-textfield data-setting="transcript" label="transcript" value="" placeholder="" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="audio-recorder attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/docs/components/audio-recorder/examples/attributes.js"></script>
    </div>

    <div role="example" label="Spoken answer">
      <tp-fill-blank-question open="">
        <dl>
          <dt>Title</dt><dd>A spoken answer</dd>
          <dt>Answers</dt><dd><ol><li>blue</li></ol></dd>
          <dt>Prompt</dt><dd>Say the word “blue”. Stop recording, review the transcript and submit. Recognition may use an online service; you can also type the answer.</dd>
          <dt>Form</dt><dd>
            <tp-audio-recorder transcript="#spoken-answer" lang="en-US"></tp-audio-recorder>
            <tp-textfield id="spoken-answer" name="color" clearable="" regexp="blue[.!?]?" label="Your answer"></tp-textfield>
          </dd>
          <dt>Solution</dt><dd>blue</dd>
        </dl>
      </tp-fill-blank-question>
    </div>
  </template>
</tp-html-viewer>
