<tp-html-viewer label="tp-csv-table" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-csv-table heading="">
        <script type="tp/csv-table">
          Country,Capital
          Estonia,Tallinn
          Latvia,Riga
          Lithuania,Vilnius
        </script>
      </tp-csv-table>
    </div>

    <div role="example" label="Quoted fields">
      <tp-csv-table heading="" separator=";">
      <script type="tp/csv-table">
      Name;Note
      "Ada; Lovelace";"A quoted ""word"""
      Grace;"First line
      Second line"
      </script>
      </tp-csv-table>
    </div>
  </template>
</tp-html-viewer>
