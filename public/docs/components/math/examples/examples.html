<tp-html-viewer label="tp-math" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <p>The identity <tp-math value="a^2 + b^2 = c^2" label="a squared plus b squared equals c squared"></tp-math> describes a right triangle.</p>
    </div>

    <div role="example" label="Script and display style">
      <tp-math><script type="tp/math">\frac{1}{2\sqrt{x}}</script></tp-math>
      <tp-math displaystyle=""><script type="tp/math">\frac{1}{2\sqrt{x}}</script></tp-math>
    </div>

    <div role="example" label="AsciiMath">
      <p>An inline expression: <tp-math mode="asciimath" value="1/(2sqrt(x))" label="One divided by twice the square root of x"></tp-math>.</p>
      <tp-math mode="asciimath" value="1/(2sqrt(x))" displaystyle="" label="One divided by twice the square root of x"></tp-math>
    </div>

    <div role="example" label="External expression">
      <tp-math src="/docs/components/math/examples/identity.txt" displaystyle=""></tp-math>
    </div>
  </template>
</tp-html-viewer>
