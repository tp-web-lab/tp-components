<html>
  <head>
    <title>Lit tabs component</title>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <h2>Lit tabs component</h2>

    <p>
      This example defines a custom tabs component in shadow DOM with Lit.
    </p>

    <tp-demo-tabs>
      <dl>
        <dt>HTML</dt>
        <dd>HTML structures the document.</dd>

        <dt>CSS</dt>

        <dd>JavaScript adds behavior.</dd>

        <dt>Lit</dt>
        <dd><a href="https://lit.dev/" target="_blank" rel="noopener noreferrer">Lit</a> helps create reactive custom elements with <a href="https://developer.mozilla.org/en-US/docs/Web/Web_Components/Using_shadow_DOM" target="_blank" rel="noopener noreferrer">shadow DOM</a>.</dd>
      </dl>
    </tp-demo-tabs>
