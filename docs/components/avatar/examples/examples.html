<tp-html-viewer label="tp-avatar" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-cluster>
        <tp-avatar src="/tp-components/docs/medias/logos/logo-tp.svg" label="tp-components"></tp-avatar>
        <tp-avatar initials="AL" label="Ada Lovelace"></tp-avatar>
        <tp-avatar icon="user" shape="square" label="Guest"></tp-avatar>
      </tp-cluster>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>

      <tp-radio-list data-setting="shape" label="shape" label-position="top" orientation="horizontal" value="1"><ul><li>circle</li><li>square</li></ul></tp-radio-list>
      <tp-radio-list data-setting="size" label="size" label-position="top" orientation="horizontal" value="4"><ul><li>xxs</li><li>xs</li><li>s</li><li>m</li><li>l</li><li>xl</li><li>xxl</li></ul></tp-radio-list>
      <tp-radio-list data-setting="src" label="src" label-position="top" orientation="horizontal" value="1"><ul><li>No image (default)</li><li>tp-components logo</li><li>Portrait illustration</li><li>Missing image (test fallback)</li></ul></tp-radio-list>
      <tp-cluster><tp-textfield data-setting="icon" label="icon" value="user" placeholder="user" clearable></tp-textfield>
      <tp-textfield data-setting="initials" label="initials" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="label" label="label" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="library" label="library" value="tp" placeholder="tp" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="avatar attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>
      <p>The src control selects no image, the tp-components logo, a portrait illustration or a deliberately missing image. A missing image displays the initials, or the icon if no initials are set. These choices only restrict this demo: the component accepts an image URL in src.</p>
      <script type="module" src="/tp-components/docs/components/avatar/examples/attributes.js"></script>
    </div>
  </template>
</tp-html-viewer>
