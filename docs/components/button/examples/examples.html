<tp-html-viewer label="tp-button" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-button href="/#/components/button/index.md#usage">Read the usage guide</tp-button>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>
      <tp-checkbox-list id="attributes-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value=""><ul><li>disabled</li><li>loading</li><li>outlined</li><li>pill</li></ul></tp-checkbox-list>
      <tp-radio-list data-setting="loading-mode" label="loading-mode" label-position="top" orientation="horizontal" value="1"><ul><li>replace</li><li>inline</li></ul></tp-radio-list>
      <tp-radio-list data-setting="size" label="size" label-position="top" orientation="horizontal" value="4"><ul><li>xxs</li><li>xs</li><li>s</li><li>m</li><li>l</li><li>xl</li><li>xxl</li></ul></tp-radio-list>
      <tp-radio-list data-setting="type" label="type" label-position="top" orientation="horizontal" value="1"><ul><li>button</li><li>submit</li><li>reset</li></ul></tp-radio-list>
      <tp-radio-list data-setting="variant" label="variant" label-position="top" orientation="horizontal" value="5"><ul><li>success</li><li>danger</li><li>warning</li><li>info</li><li>neutral</li><li>brand</li></ul></tp-radio-list>
      <tp-cluster><tp-textfield data-setting="download" label="download" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="href" label="href" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="rel" label="rel" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="target" label="target" value="" placeholder="" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="button attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/tp-components/docs/components/button/examples/attributes.js"></script>
    </div>
  </template>
</tp-html-viewer>
