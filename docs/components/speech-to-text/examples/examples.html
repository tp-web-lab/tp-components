<tp-html-viewer label="tp-speech-to-text" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-speech-to-text lang="en-US" interim-results=""></tp-speech-to-text>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>
      <tp-checkbox-list id="attributes-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value=""><ul><li>continuous</li><li>disabled</li><li>interim-results</li></ul></tp-checkbox-list>

      <tp-cluster><tp-textfield data-setting="value" label="value" value="" placeholder="" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="speech-to-text attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/tp-components/docs/components/speech-to-text/examples/attributes.js"></script>
    </div>

    <div role="example" label="Basic">
      <tp-speech-to-text lang="en-US"></tp-speech-to-text>
    </div>

    <div role="example" label="French">
      <tp-speech-to-text lang="fr-FR"></tp-speech-to-text>
    </div>
  </template>
</tp-html-viewer>
