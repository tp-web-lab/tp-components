<tp-html-viewer label="tp-modal" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-box data-intro-action="modal" data-allow-script="">
        <tp-button id="intro-modal-trigger" data-demo-trigger="">Open the modal</tp-button>
        <tp-modal backdrop="" outside-click="" aria-label="Example modal"><p>This panel contains additional information.</p><tp-button data-demo-close="">Close</tp-button></tp-modal>
        <p data-demo-status="" role="status">Try the modal using its trigger.</p>
        <script src="/tp-components/docs/components/_shared/introduction-actions.js"></script>
      </tp-box>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>
      <tp-checkbox-list id="attributes-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value=""><ul><li>backdrop</li><li>breakout</li><li>fixed</li><li>open</li><li>outside-click</li></ul></tp-checkbox-list>

      <tp-cluster><tp-textfield data-setting="margin" label="margin" value="" placeholder="" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="modal attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/tp-components/docs/components/modal/examples/attributes.js"></script>
    </div>
  </template>
</tp-html-viewer>
