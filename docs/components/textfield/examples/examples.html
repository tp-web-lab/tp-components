<tp-html-viewer label="tp-textfield" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-textfield label="Single line" placeholder="Type some text..." clearable=""></tp-textfield>
    </div>

    <div role="example" label="Attributes">
      <p>Change several attributes on one preview. All controls start at their documented defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Reset defaults fills the controls with their defaults again. Controls stay available when the preview is disabled or readonly.</p>
      <tp-stack>
        <tp-checkbox-list id="textfield-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value=""><ul><li>clearable</li><li>disabled</li><li>multiline</li><li>readonly</li><li>required</li></ul></tp-checkbox-list>
        <tp-radio-list data-setting="label-position" label="label-position" label-position="top" orientation="horizontal" value="1"><ul><li>top</li><li>bottom</li><li>start</li><li>end</li></ul></tp-radio-list>
      <tp-radio-list data-setting="type" label="type" label-position="top" orientation="horizontal" value="1"><ul><li>text</li><li>email</li><li>password</li><li>search</li><li>tel</li><li>url</li></ul></tp-radio-list>
        <tp-cluster><tp-textfield data-setting="aria-label" label="aria-label" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="autocomplete" label="autocomplete" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="icon" label="icon" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="icon-library" label="icon-library" value="tp" placeholder="tp" clearable></tp-textfield>
      <tp-textfield data-setting="label" label="label" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="name" label="name" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="placeholder" label="placeholder" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="rows" label="rows" value="3" placeholder="3" clearable></tp-textfield>
      <tp-textfield data-setting="value" label="value" value="" placeholder="" clearable></tp-textfield></tp-cluster>
        <tp-button id="textfield-reset" type="button">Reset defaults</tp-button>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-box><tp-textfield id="textfield-preview"></tp-textfield></tp-box>
      <tp-box id="textfield-readout" aria-live="polite">Reading native attributes…</tp-box>
      <tp-callout variant="info" heading="Things to try">Set label or aria-label to give the preview an accessible name. Choose type email and enter email in autocomplete, then focus the preview to try browser-managed suggestions (saved data and browser settings are required). Enable multiline to test rows. Type applies to single-line inputs only. Enable clearable to show the clear button; it is hidden otherwise.</tp-callout>
      <script type="module" src="/tp-components/docs/components/textfield/examples/attributes.js"></script>
    </div>

    <div role="example" label="Inline named field">
      <p>Value: <tp-textfield name="identifier" value="Ada" placeholder="Enter a value"></tp-textfield></p>
    </div>
  </template>
</tp-html-viewer>
