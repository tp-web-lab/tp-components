<tp-html-viewer label="tp-animation" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-animation in="fadeIn" trigger="load" duration="800ms">
          <tp-box>Animated content</tp-box>
        </tp-animation>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>
      <tp-checkbox-list id="attributes-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value=""><ul><li>once</li><li>paused</li></ul></tp-checkbox-list>
      <tp-radio-list data-setting="fill" label="fill" label-position="top" orientation="horizontal" value="4"><ul><li>none</li><li>forwards</li><li>backwards</li><li>both</li><li>auto</li></ul></tp-radio-list>
      <tp-radio-list data-setting="trigger" label="trigger" label-position="top" orientation="horizontal" value="1"><ul><li>load</li><li>click</li><li>hover</li><li>manual</li><li>intersection</li></ul></tp-radio-list>
      <tp-cluster><tp-textfield data-setting="delay" label="delay" value="0s" placeholder="0s" clearable></tp-textfield>
      <tp-textfield data-setting="duration" label="duration" value="1s" placeholder="1s" clearable></tp-textfield>
      <tp-textfield data-setting="easing" label="easing" value="ease" placeholder="ease" clearable></tp-textfield>
      <tp-textfield data-setting="in" label="in" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="iterations" label="iterations" value="1" placeholder="1" clearable></tp-textfield>
      <tp-textfield data-setting="out" label="out" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="root-margin" label="root-margin" value="0px" placeholder="0px" clearable></tp-textfield>
      <tp-textfield data-setting="target" label="target" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="threshold" label="threshold" value="0.1" placeholder="0.1" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="animation attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/tp-components/docs/components/animation/examples/attributes.js"></script>
    </div>
  </template>
</tp-html-viewer>
