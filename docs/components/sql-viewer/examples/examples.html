<tp-html-viewer label="tp-sql-viewer" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-box>
        <p>The query lists three European capitals. Expand the query in the result panel to see its rows.</p>
        <tp-sql-viewer src="/tp-components/docs/components/_shared/intro-projects/sql.json"></tp-sql-viewer>
      </tp-box>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>

      <tp-radio-list data-setting="repository" label="repository" label-position="top" orientation="horizontal" value="1"><ul><li>Default</li><li>file1</li><li>file2</li><li>file-unknown</li></ul></tp-radio-list>
      <tp-radio-list data-setting="src" label="src" label-position="top" orientation="horizontal" value="1"><ul><li>Default</li><li>file1</li><li>file2</li><li>file-unknown</li></ul></tp-radio-list>
      <tp-cluster></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="sql-viewer attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>
      <p>File-loading attributes offer only Default, file1, file2 and file-unknown. The two local fixtures preserve verified example formats (they may contain the same content); file-unknown deliberately exercises error handling. No arbitrary path can be entered.</p>
      <script type="module" src="/tp-components/docs/components/sql-viewer/examples/attributes.js"></script>
    </div>

    <div role="example" label="src">
      <tp-sql-viewer src="/tp-components/docs/components/sql-viewer/examples/example.json"></tp-sql-viewer>
    </div>

    <div role="example" label="script without filename">
      <tp-sql-viewer>
            <script type="tp/sql">
              CREATE TABLE users (name TEXT NOT NULL);
              INSERT INTO users (name) VALUES ('Ada'), ('Grace');
            </script>
          </tp-sql-viewer>
    </div>

    <div role="example" label="scripts with filename">
      <tp-sql-viewer>
            <script type="tp/sql" filename="tables.sql">
              CREATE TABLE users (name TEXT NOT NULL);
              INSERT INTO users (name) VALUES ('Ada'), ('Grace');
            </script>
            <script type="tp/sql" filename="query.sql">
              SELECT name
              FROM users
              ORDER BY name;
            </script>
          </tp-sql-viewer>
    </div>

    <div role="example" label="error">
      <tp-sql-viewer>
            <script type="tp/sql" filename="query.sql">
              SELECT * FROM missing_table;
            </script>
          </tp-sql-viewer>
    </div>

    <div role="example" label="Single source file">
      <tp-sql-viewer src="/tp-components/docs/components/_shared/single-source/example.sql"></tp-sql-viewer>
    </div>
  </template>
</tp-html-viewer>
