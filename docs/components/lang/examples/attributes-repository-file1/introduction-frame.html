<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>tp-lang — Basic usage</title></head>
<body>
<!-- example:start -->
<tp-box data-intro-action="lang" data-allow-script>
  <p>Choose English or French to change the message in this isolated example.</p>
  <tp-lang langs="en,fr" repository="/tp-components/docs/components/lang/examples"></tp-lang>
  <h2 data-demo-translation>Welcome to this example.</h2>
  <script src="/tp-components/docs/components/_shared/introduction-actions.js"></script>
</tp-box>
<!-- example:end -->
<script type="module" src="../../_shared/component-preview.js"></script>
</body>
</html>
