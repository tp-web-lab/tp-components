<tp-html-viewer label="tp-cryptarithm" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-cryptarithm equation="SEND + MORE = MONEY" solution="9567 + 1085 = 10652"></tp-cryptarithm>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>


      <tp-cluster><tp-textfield data-setting="equation" label="equation" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="solution" label="solution" value="" placeholder="" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="cryptarithm attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/tp-components/docs/components/cryptarithm/examples/attributes.js"></script>
    </div>

    <div role="example" label="UN + UN + NEUF = ONZE">
      <tp-cryptarithm equation="UN + UN + NEUF = ONZE" solution="81 + 81 + 1987 = 2149"></tp-cryptarithm>
    </div>

    <div role="example" label="CINQ + CINQ + VINGT = TRENTE">
      <tp-cryptarithm equation="CINQ + CINQ + VINGT = TRENTE" solution="6483 + 6483 + 94851 = 107817"></tp-cryptarithm>
    </div>

    <div role="example" label="ZERO + NEUF + NEUF + DOUZE = TRENTE">
      <tp-cryptarithm equation="ZERO + NEUF + NEUF + DOUZE = TRENTE" solution="9206 + 3257 + 3257 + 86592 = 102312"></tp-cryptarithm>
    </div>
  </template>
</tp-html-viewer>
