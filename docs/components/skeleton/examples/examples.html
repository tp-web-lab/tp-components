<tp-html-viewer label="tp-skeleton" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-skeleton label="Article layout preview">
        <script type="tp/html">
          <main>
            <nav>Home · Articles · About</nav>
            <h1>Building accessible interfaces</h1>
            <p>An introduction to the article.</p>
            <figure><img src="portrait.jpg" alt="Portrait"><figcaption>Caption</figcaption></figure>
            <h2>Key ideas</h2>
            <ul><li>Clear structure</li><li>Consistent interactions</li></ul>
            <table><tr><th>Feature</th><th>Status</th></tr><tr><td>Keyboard</td><td>Ready</td></tr></table>
            <blockquote>A useful quotation.</blockquote>
          </main>
        </script>
      </tp-skeleton>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>

      <tp-radio-list data-setting="src" label="src" label-position="top" orientation="horizontal" value="1"><ul><li>Inline HTML (default)</li><li>Article HTML</li><li>Reference HTML with iframe</li><li>Missing HTML (test error)</li></ul></tp-radio-list>
      <tp-cluster><tp-textfield data-setting="label" label="label" value="Content layout preview" placeholder="Content layout preview" clearable></tp-textfield>
      <tp-textfield data-setting="value" label="value" value="" placeholder="" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="skeleton attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>
      <p>The src control offers the inline example, two reviewed HTML documents and a missing file to test the warning. A nonempty src takes precedence over value; clear src to test a literal HTML value containing a heading and a paragraph. HTML is source data: it is not executed.</p>
      <script type="module" src="/tp-components/docs/components/skeleton/examples/attributes.js"></script>
    </div>
  </template>
</tp-html-viewer>
