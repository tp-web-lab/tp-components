<tp-html-viewer label="tp-iframe" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-iframe src="/tp-components/docs/components/iframe/examples/welcome.html" title="A document inside an iframe" style="height: 12rem;"></tp-iframe>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>
      <tp-checkbox-list id="attributes-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value="3"><ul><li>controls</li><li>fullscreen</li><li>interaction</li></ul></tp-checkbox-list>
      <tp-radio-list data-setting="loading" label="loading" label-position="top" orientation="horizontal" value="1"><ul><li>Default (empty)</li><li>eager</li><li>lazy</li></ul></tp-radio-list>
      <tp-radio-list data-setting="referrerpolicy" label="referrerpolicy" label-position="top" orientation="horizontal" value="1"><ul><li>Default (empty)</li><li>no-referrer</li><li>no-referrer-when-downgrade</li><li>origin</li><li>origin-when-cross-origin</li><li>same-origin</li><li>strict-origin</li><li>strict-origin-when-cross-origin</li><li>unsafe-url</li></ul></tp-radio-list>
      <tp-radio-list data-setting="src" label="src" label-position="top" orientation="horizontal" value="1"><ul><li>Default</li><li>file1</li><li>file2</li><li>file-unknown</li></ul></tp-radio-list>
      <tp-cluster><tp-textfield data-setting="sandbox" label="sandbox" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="srcdoc" label="srcdoc" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="zoom" label="zoom" value="1" placeholder="1" clearable></tp-textfield>
      <tp-textfield data-setting="zoom-levels" label="zoom-levels" value="25% 50% 75% 100% 125% 150% 175% 200%" placeholder="25% 50% 75% 100% 125% 150% 175% 200%" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="iframe attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>
      <p>File-loading attributes offer only Default, file1, file2 and file-unknown. The two local fixtures preserve verified example formats (they may contain the same content); file-unknown deliberately exercises error handling. No arbitrary path can be entered.</p>
      <script type="module" src="/tp-components/docs/components/iframe/examples/attributes.js"></script>
    </div>
  </template>
</tp-html-viewer>
