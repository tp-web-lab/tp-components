<tp-html-viewer label="tp-python-playground" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-python-playground src="/tp-components/docs/components/_shared/intro-projects/python.json"></tp-python-playground>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>

      <p>Default displays a greeting in the HTML document and the console. For src, file1 displays 6 × 7 = 42; file2 displays the squares of 1 to 5. For repository, dir1 calculates 2 + 3; dir2 imports rectangle_area from geometry.py into main.py and displays the area of a rectangle. Both directories include index.html. Edit the Python files and press Run to update the result. Choose Default for src before testing repository: a nonempty src takes precedence. file-unknown and dir-unknown test loading errors: the console displays only the error, and the last valid project is retained.</p>
      <tp-stack>

      <tp-radio-list data-setting="repository" label="repository" label-position="top" orientation="horizontal" value="1"><ul><li>Default</li><li>dir1</li><li>dir2</li><li>dir-unknown</li></ul></tp-radio-list>
      <tp-radio-list data-setting="src" label="src" label-position="top" orientation="horizontal" value="1"><ul><li>Default</li><li>file1</li><li>file2</li><li>file-unknown</li></ul></tp-radio-list>
      <tp-cluster></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="python-playground attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>
      <p>Resource controls offer only Default, two reviewed local fixtures and one missing resource: file1, file2 and file-unknown for src; dir1, dir2 and dir-unknown for repository. No arbitrary path can be entered.</p>
      <script type="module" src="/tp-components/docs/components/python-playground/examples/attributes.js"></script>
    </div>

    <div role="example" label="Single source file">
      <tp-python-playground src="/tp-components/docs/components/_shared/single-source/example.py"></tp-python-playground>
    </div>
  </template>
</tp-html-viewer>
