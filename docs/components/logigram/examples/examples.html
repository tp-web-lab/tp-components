<tp-html-viewer label="tp-logigram" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-logigram label="The reading club">
        <dl>
          <dt>Prompt</dt>
          <dd><p>Three readers chose different books and drinks. Find every match.</p></dd>
          <dt>Categories</dt>
          <dd>
        <ul>
          <li>Readers<ul><li>Ada</li><li>Ben</li><li>Cleo</li></ul></li>
          <li>Books<ul><li>Poetry</li><li>History</li><li>Science</li></ul></li>
          <li>Drinks<ul><li>Tea</li><li>Juice</li><li>Water</li></ul></li>
        </ul>
        </dd>
          <dt>Clues</dt>
          <dd>
        <ol>
          <li>Ada chose Poetry.</li>
          <li>The History reader drank Juice.</li>
          <li>Ben drank Water.</li>
          <li>Cleo did not choose Poetry.</li>
        </ol>
        </dd>
          <dt>Solution</dt>
          <dd>
        <ol>
          <li><ul><li>Ada</li><li>Poetry</li><li>Tea</li></ul></li>
          <li><ul><li>Ben</li><li>Science</li><li>Water</li></ul></li>
          <li><ul><li>Cleo</li><li>History</li><li>Juice</li></ul></li>
        </ol>
      </dd>
        </dl>
      </tp-logigram>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>



      <tp-stack>
      <tp-checkbox-list id="attributes-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value=""><ul><li>auto-exclude</li><li>disabled</li></ul></tp-checkbox-list>
      <tp-radio-list data-setting="src" label="src" label-position="top" orientation="horizontal" value="1"><ul><li>Default</li><li>file1</li><li>file2</li><li>file-unknown</li></ul></tp-radio-list>
      <tp-cluster><tp-textfield data-setting="label" label="label" value="Logigram" placeholder="Logigram" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="logigram attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>
      <p>File-loading attributes offer only Default, file1, file2 and file-unknown. The two local fixtures preserve verified example formats (they may contain the same content); file-unknown deliberately exercises error handling. No arbitrary path can be entered.</p>
      <script type="module" src="/tp-components/docs/components/logigram/examples/attributes.js"></script>
    </div>

    <div role="example" label="Automatic exclusions">
      <tp-logigram label="The reading club" auto-exclude="">
        <dl>
          <dt>Prompt</dt>
          <dd><p>Three readers chose different books and drinks. Find every match.</p></dd>
          <dt>Categories</dt>
          <dd>
        <ul>
          <li>Readers<ul><li>Ada</li><li>Ben</li><li>Cleo</li></ul></li>
          <li>Books<ul><li>Poetry</li><li>History</li><li>Science</li></ul></li>
          <li>Drinks<ul><li>Tea</li><li>Juice</li><li>Water</li></ul></li>
        </ul>
        </dd>
          <dt>Clues</dt>
          <dd>
        <ol>
          <li>Ada chose Poetry.</li>
          <li>The History reader drank Juice.</li>
          <li>Ben drank Water.</li>
          <li>Cleo did not choose Poetry.</li>
        </ol>
        </dd>
          <dt>Solution</dt>
          <dd>
        <ol>
          <li><ul><li>Ada</li><li>Poetry</li><li>Tea</li></ul></li>
          <li><ul><li>Ben</li><li>Science</li><li>Water</li></ul></li>
          <li><ul><li>Cleo</li><li>History</li><li>Juice</li></ul></li>
        </ol>
      </dd>
        </dl>
      </tp-logigram>
    </div>
  </template>
</tp-html-viewer>
