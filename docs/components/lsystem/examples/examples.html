<tp-html-viewer label="tp-lsystem" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-lsystem label="Koch curve">
        <script type="tp/lsystem">
          axiom: F
          iterations: 3
          angle: 60
          rule: F => F+F--F+F
        </script>
      </tp-lsystem>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>

      <tp-radio-list data-setting="preset" label="preset" label-position="top" orientation="horizontal" value="3"><ul><li>fractal-tree</li><li>barnsley-fern</li><li>koch-curve</li><li>dragon-curve</li><li>hilbert-curve</li><li>peano-curve</li><li>levy-c-curve</li><li>gosper-curve</li><li>pythagoras-tree</li><li>sierpinski-triangle</li><li>sierpinski-carpet</li><li>sierpinski-arrowhead</li><li>sierpinski-gasket</li><li>sierpinski-tetrahedron</li></ul></tp-radio-list>
      <tp-radio-list data-setting="src" label="src" label-position="top" orientation="horizontal" value="1"><ul><li>Default</li><li>file1</li><li>file2</li><li>file-unknown</li></ul></tp-radio-list>
      <tp-cluster><tp-textfield data-setting="angle" label="angle" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="interval" label="interval" value="1000" placeholder="1000" clearable></tp-textfield>
      <tp-textfield data-setting="iterations" label="iterations" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="label" label="label" value="L-system" placeholder="L-system" clearable></tp-textfield>
      <tp-textfield data-setting="step" label="step" value="" placeholder="" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="lsystem attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>
      <p>File-loading attributes offer only Default, file1, file2 and file-unknown. The two local fixtures preserve verified example formats (they may contain the same content); file-unknown deliberately exercises error handling. No arbitrary path can be entered.</p>
      <script type="module" src="/tp-components/docs/components/lsystem/examples/attributes.js"></script>
    </div>

    <div role="example" label="Branching tree">
      <tp-lsystem src="/tp-components/docs/components/lsystem/examples/tree.lsys" label="Branching tree"></tp-lsystem>
    </div>

    <div role="example" label="Preset gallery">
      <tp-grid min-width="16rem"><tp-lsystem preset="barnsley-fern" label="Barnsley fern"></tp-lsystem><tp-lsystem preset="dragon-curve" label="Dragon curve"></tp-lsystem><tp-lsystem preset="sierpinski-triangle" label="Sierpinski triangle"></tp-lsystem></tp-grid>
    </div>
  </template>
</tp-html-viewer>
