<tp-html-viewer label="tp-formula-picker" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-formula-picker></tp-formula-picker>
    </div>

    <div role="example" label="Selection event">
      <tp-formula-picker id="formula-event-picker"></tp-formula-picker><tp-textfield id="formula-event-result" label="Selected formula" placeholder="Select a formula" clearable=""></tp-textfield><script type="module">const picker = document.querySelector("#formula-event-picker");
      const result = document.querySelector("#formula-event-result");
      await customElements.whenDefined("tp-textfield");
      picker.addEventListener("tp-formula-picker-select", (event) => {
        result.value = event.detail.formula;
      });</script>
    </div>
  </template>
</tp-html-viewer>
