<tp-html-viewer label="tp-notebook" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-notebook>
        <script type="tp/markdown">
          # Notebook example
          Here is a notebook that combines Asciidoc, HTML, Markdown and reStructuredText as markup languages, and Python and JavaScript as programming languages.

          ## Calculation
          We perform a simple multiplication in Python to demonstrate the calculation.
        </script>
        <script type="tp/python">
          x = 6 * 7
          print(x)
        </script>
        <script type="tp/restructuredtext" doctest="">
          .. h2::

             Verification

          We use the doctest blocks in reStructuredText to verify the output of the Python code.

          >>> print(6 * 7)
          42
        </script>
        <script type="tp/html">
          In JavaScript, we would have written the following code:
        </script>
        <script type="tp/javascript">
          const x = 6 * 7;
          console.log(x)
        </script>
        <script type="tp/asciidoc">
          == Result
          The result of the multiplication is displayed using Asciidoc and Mathjax:

          latexmath:[x = 6 * 7 = 42]
        </script>
      </tp-notebook>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>
      <tp-checkbox-list id="attributes-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value=""><ul><li>readonly</li></ul></tp-checkbox-list>
      <tp-radio-list data-setting="language" label="language" label-position="top" orientation="horizontal" value="1"><ul><li>javascript</li><li>typescript</li><li>python</li><li>prolog</li><li>sql</li></ul></tp-radio-list>
      <tp-radio-list data-setting="repository" label="repository" label-position="top" orientation="horizontal" value="1"><ul><li>Default</li><li>file1</li><li>file2</li><li>file-unknown</li></ul></tp-radio-list>
      <tp-radio-list data-setting="src" label="src" label-position="top" orientation="horizontal" value="1"><ul><li>Default</li><li>file1</li><li>file2</li><li>file-unknown</li></ul></tp-radio-list>
      <tp-cluster></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="notebook attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>
      <p>File-loading attributes offer only Default, file1, file2 and file-unknown. The two local fixtures preserve verified example formats (they may contain the same content); file-unknown deliberately exercises error handling. No arbitrary path can be entered.</p>
      <script type="module" src="/tp-components/docs/components/notebook/examples/attributes.js"></script>
    </div>
  </template>
</tp-html-viewer>
