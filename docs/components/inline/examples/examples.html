<tp-html-viewer label="tp-inline" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-inline gap="1rem" align="center">
          <tp-button>Previous</tp-button><span>Page 2 of 5</span><tp-button>Next</tp-button>
        </tp-inline>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>
      <tp-checkbox-list id="attributes-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value=""><ul><li>stretch</li></ul></tp-checkbox-list>
      <tp-radio-list data-setting="align" label="align" label-position="top" orientation="horizontal" value="3"><ul><li>normal</li><li>stretch</li><li>center</li><li>start</li><li>end</li><li>flex-start</li><li>flex-end</li><li>self-start</li><li>self-end</li><li>baseline</li><li>first baseline</li><li>last baseline</li></ul></tp-radio-list>
      <tp-radio-list data-setting="justify" label="justify" label-position="top" orientation="horizontal" value="4"><ul><li>normal</li><li>start</li><li>end</li><li>flex-start</li><li>flex-end</li><li>center</li><li>left</li><li>right</li><li>space-between</li><li>space-around</li><li>space-evenly</li><li>stretch</li></ul></tp-radio-list>
      <tp-cluster><tp-textfield data-setting="gap" label="gap" value="0.5rem" placeholder="0.5rem" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="inline attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>

      <script type="module" src="/tp-components/docs/components/inline/examples/attributes.js"></script>
    </div>
  </template>
</tp-html-viewer>
