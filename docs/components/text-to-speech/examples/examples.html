<tp-html-viewer label="tp-text-to-speech" allow-script>
  <template>
    <div role="example" label="Basic usage">
      <tp-text-to-speech lang="en-GB" show-text="">
        <script type="tp/txt">
          Welcome to tp-components. This example uses the browser speech synthesis service.
        </script>
      </tp-text-to-speech>
    </div>

    <div role="example" label="Attributes">
      <p>Combine the attributes on one preview. Controls start at the published defaults. Clear leaves a text field empty and removes the corresponding preview attribute; its default remains visible as a placeholder when nonempty. Some defaults intentionally show no content: use the controls to supply it. Reset defaults fills the controls with their defaults again; Reload preview restarts initialization with the current settings.</p>
      <tp-stack>
      <tp-checkbox-list id="attributes-booleans" label="Boolean attributes" label-position="top" orientation="horizontal" value=""><ul><li>autoplay</li><li>lite</li><li>show-text</li></ul></tp-checkbox-list>
      <tp-radio-list data-setting="src" label="src" label-position="top" orientation="horizontal" value="1"><ul><li>Default</li><li>file1</li><li>file2</li><li>file-unknown</li></ul></tp-radio-list>
      <tp-cluster><tp-textfield data-setting="for" label="for" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="pitch" label="pitch" value="1" placeholder="1" clearable></tp-textfield>
      <tp-textfield data-setting="rate" label="rate" value="1" placeholder="1" clearable></tp-textfield>
      <tp-textfield data-setting="value" label="value" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="voice" label="voice" value="" placeholder="" clearable></tp-textfield>
      <tp-textfield data-setting="volume" label="volume" value="1" placeholder="1" clearable></tp-textfield></tp-cluster>
      <tp-button-group><tp-button id="attributes-reset" type="button">Reset defaults</tp-button><tp-button id="attributes-reload" type="button">Reload preview</tp-button></tp-button-group>
      </tp-stack>
      <tp-divider></tp-divider>
      <h3>Preview</h3>
      <tp-iframe id="attributes-frame" title="text-to-speech attribute preview" style="height: 24rem; display: flow-root; inline-size: auto;"></tp-iframe>
      <tp-callout id="attributes-status" variant="info" heading="Preview status">Preparing the preview…</tp-callout>
      <p>File-loading attributes offer only Default, file1, file2 and file-unknown. The two local fixtures preserve verified example formats (they may contain the same content); file-unknown deliberately exercises error handling. No arbitrary path can be entered.</p>
      <script type="module" src="/tp-components/docs/components/text-to-speech/examples/attributes.js"></script>
    </div>

    <div role="example" label="English voices">
      <tp-text-to-speech id="voice-comparison" value="Welcome to tp-components. You can pause this reading and resume it whenever you want." lang="en-US" show-text=""></tp-text-to-speech>
            <script type="module" src="/tp-components/docs/components/text-to-speech/examples/voice-comparison.js"></script>
    </div>

    <div role="example" label="French voices">
      <tp-text-to-speech id="voice-comparison" value="Bienvenue dans tp-components. Vous pouvez mettre cette lecture en pause, puis la reprendre à votre rythme." lang="fr-FR" show-text=""></tp-text-to-speech>
            <script type="module" src="/tp-components/docs/components/text-to-speech/examples/voice-comparison.js"></script>
    </div>

    <div role="example" label="Synchronized speech">
      <p>Press Speak, then try Pause, Resume and Stop. Some voices do not report word boundaries; the full text remains visible in that case.</p>
      <tp-typewriting id="spoken-text" word="">
        <p>Welcome to <strong>tp-components</strong>. You can pause this reading and resume it whenever you want.</p>
      </tp-typewriting>
      <tp-text-to-speech for="spoken-text" lang="en"></tp-text-to-speech>
    </div>

    <div role="example" label="Read an element">
      <article id="reading-article">
      <p>Welcome to <strong>tp-components</strong>. This article stays visible while it is read aloud.</p>
      <p>You can pause the reading, resume it, or stop it whenever you want.</p>
      </article>
      <tp-text-to-speech for="reading-article" lang="en"></tp-text-to-speech>
    </div>
  </template>
</tp-html-viewer>
