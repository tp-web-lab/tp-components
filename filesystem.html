<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>tp-filesystem demo</title>

    <script type="module">
      import { TpFilesystem } from './src/index.ts';

      window.addEventListener('DOMContentLoaded', () => {
        const filesystem = document.querySelector('tp-filesystem');

        if (!(filesystem instanceof TpFilesystem)) {
          return;
        }

        filesystem.setState({
          files: [
            {
              path: '/index.html',
              language: 'html',
              content: `
<!doctype html>
<html>
  <body>
    <h1>Hello tp-lib</h1>
  </body>
</html>
              `.trim(),
            },
            {
              path: '/styles/main.css',
              language: 'css',
              content: `
body {
  font-family: sans-serif;
}
              `.trim(),
            },
            {
              path: '/scripts/main.js',
              language: 'javascript',
              content: `
console.log('hello');
              `.trim(),
            },
            {
              path: '/README.md',
              language: 'markdown',
              readonly: true,
              content: `
# Demo project
              `.trim(),
            },
          ],

          activePath: '/index.html',

          openPaths: [
            '/index.html',
            '/styles/main.css',
          ],

          dirtyPaths: [
            '/styles/main.css',
          ],
        });

        filesystem.addEventListener(
          'tp-filesystem-open',
          (event) => {
            console.log('open', event.detail.path);
          },
        );

        filesystem.addEventListener(
          'tp-filesystem-active',
          (event) => {
            console.log('active', event.detail.path);
          },
        );

        filesystem.addEventListener(
          'tp-filesystem-change',
          (event) => {
            console.log('files changed', event.detail.files);
          },
        );

        filesystem.addEventListener(
          'tp-filesystem-rename',
          (event) => {
            console.log(
              'rename',
              event.detail.oldPath,
              '->',
              event.detail.newPath,
            );
          },
        );

        filesystem.addEventListener(
          'tp-filesystem-delete',
          (event) => {
            console.log('delete', event.detail.path);
          },
        );
      });
    </script>

    <style>
      body {
        margin: 0;
        padding: 2rem;
        font-family: sans-serif;
      }

      tp-filesystem {
        display: block;
        border: 1px solid #d0d7de;
        border-radius: 0.5rem;
        padding: 1rem;
        max-inline-size: 400px;
      }
    </style>
  </head>

  <body>
    <tp-filesystem></tp-filesystem>
  </body>
</html>
