name: Accessibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: tp-components

jobs:
  axe:
    name: axe (Chromium, Firefox, WebKit)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          path: tp-components
          persist-credentials: false
      - uses: ./tp-components/.github/actions/setup-workspace
        with:
          utilities-key: ${{ secrets.TP_UTILITIES_READ_KEY }}
          markdown-key: ${{ secrets.TP_MARKDOWN_READ_KEY }}
          asciidoc-key: ${{ secrets.TP_ASCIIDOC_READ_KEY }}
          restructuredtext-key: ${{ secrets.TP_RESTRUCTUREDTEXT_READ_KEY }}
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Scan component examples
        run: pnpm test:a11y
      - name: Keep the transversal report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: accessibility-report
          path: |
            tp-components/config/accessibility-browser-results.json
            tp-components/public/docs/appendices/accessibility/index.md
            tp-components/test-results/accessibility
          if-no-files-found: warn
