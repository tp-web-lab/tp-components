name: Accessibility

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: tp-components

jobs:
  axe:
    name: axe (Chromium, Firefox, WebKit)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          path: tp-components
          persist-credentials: false
          fetch-depth: 0
      - uses: ./tp-components/.github/actions/setup-workspace
        with:
          utilities-key: ${{ secrets.TP_UTILITIES_READ_KEY }}
          markdown-key: ${{ secrets.TP_MARKDOWN_READ_KEY }}
          asciidoc-key: ${{ secrets.TP_ASCIIDOC_READ_KEY }}
          restructuredtext-key: ${{ secrets.TP_RESTRUCTUREDTEXT_READ_KEY }}
      - name: Select affected components
        id: scope
        env:
          A11Y_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          A11Y_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          A11Y_EVENT: ${{ github.event_name }}
        run: node scripts/select-accessibility-components.mjs
      - if: steps.scope.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Scan component examples
        if: steps.scope.outputs.run == 'true'
        env:
          TP_A11Y_COMPONENTS: ${{ steps.scope.outputs.components }}
          TP_A11Y_FULL: ${{ steps.scope.outputs.full }}
        run: |
          if [ "$TP_A11Y_FULL" = "true" ]; then
            pnpm test:a11y
          else
            pnpm test:a11y components.a11y.test.ts
          fi
      - name: Keep this run report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: accessibility-report
          path: |
            tp-components/config/accessibility-run-results.json
            tp-components/test-results/accessibility
          if-no-files-found: warn
