<!doctype html>
<html>
  <head>
    <title>Vanilla Web Components tabs</title>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <h2>Vanilla Web Components tabs (no framework)</h2>

    <tp-demo-tabs>
      <dl>
        <dt>HTML</dt>
        <dd>HTML structures the document.</dd>

        <dt>CSS</dt>
        <dd>CSS styles the document.</dd>

        <dt>JavaScript</dt>
        <dd>JavaScript adds behavior.</dd>

        <dt>Web Components</dt>
        <dd>
          <a href="https://developer.mozilla.org/en-US/docs/Web/API/Web_components" target="_blank" rel="noopener noreferrer">Web Components</a>
          provide native custom elements.
        </dd>
      </dl>
    </tp-demo-tabs>
  </body>
</html>
